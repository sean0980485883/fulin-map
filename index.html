<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>富林組合屋工作台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<meta name="theme-color" content="#1F5C55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.FULIN_CONFIG = {
  // 後台網址：「富林系統資料庫」Apps Script 部署後的網址（…/exec）
  API_URL: "https://script.google.com/macros/s/AKfycbyX1V9nAHC-CmVTxYR4trAOsx_sjuqYkgivZa3GlWFff7m9hCgeCWdngpZU91qgUuDpkw/exec",
  GOOGLE_MAPS_KEY: "",   // 貼上 Google 地圖 API 金鑰；留空則使用備用底圖（Esri）
  REFRESH_MINUTES: 5
};
</script>
<style>
:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --ink:#1E2A2C; --muted:#63706F; --line:#DCE0DA; --hover:#EEF2EB;
  --accent:#1F5C55; --accent-ink:#FFFFFF;
  --issue:#1E1E1E; --active:#2E9E44; --week:#1F63E0; --later:#79A6EE; --done:#9AA3A2;
  --issue-bg:#ECECEC; --active-bg:#E5F4E8; --week-bg:#E4EDFC; --later-bg:#EEF3FD; --done-bg:#EEF0EF;
  --shadow:0 6px 24px rgba(30,42,44,.14);
  --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
.shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.page{grid-template-columns:minmax(0,1fr)}
.topbar,.tabs{min-width:0}
.topbar{display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--accent);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.brand{font-weight:700;font-size:15px;letter-spacing:.04em;white-space:nowrap;padding:12px 0}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{border:0;background:none;color:rgba(255,255,255,.75);padding:14px 14px 11px;font-size:14px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
.tab .cnt{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.2);border-radius:999px;padding:1px 7px;margin-left:6px}
.tab .cnt.bad{background:#E5484D;color:#fff}
.view{min-height:0;overflow:auto}
#v-map{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.pin .dot.star{left:-13px;top:-13px;width:26px;height:26px;font-size:17px;color:#FFC400;text-shadow:0 0 1px #7a5a00;border-width:3px;border-color:#FFC400}
.pin.hl .dot.star,.pin:hover .dot.star{transform:scale(1.35)}
.row .star{color:#E0A800;margin-right:4px}
.legend .lstar{color:#E0A800;font-size:14px;line-height:1}
.pin .today{position:absolute;left:10px;top:-26px;background:#F59E0B;color:#1E1E1E;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;border:1.5px solid #fff;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
#map{height:100%;width:100%;background:#E6EAE4}
.mapwrap{position:relative;min-height:0}
.legend{position:absolute;left:12px;bottom:24px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.fitbtn{position:absolute;right:10px;top:86px;z-index:500;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}

.pin{position:relative;width:0;height:0}
.pin .dot{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;line-height:1}
.pin.sel .dot{left:-12px;top:-12px;width:24px;height:24px;border-color:var(--ink)}
.pin .halo{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;border:2px solid var(--issue);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin .halo{animation:none;opacity:.35}}
.pin .tag{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--c);color:#fff;font-family:var(--mono);font-size:11px;padding:0 6px;border-radius:4px;border:1.5px solid #fff;white-space:nowrap;line-height:16px}
.pin .lbl{position:absolute;left:14px;top:-9px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.pin .lbl.hide{display:none}
/* 滑到列表或標記時：放大、跳動、顯示名稱 */
.pin.hl .lbl,.pin:hover .lbl{display:block;background:var(--ink);color:#fff;text-shadow:none;padding:2px 8px;border-radius:6px;top:-12px;left:18px;font-size:13px;box-shadow:var(--shadow)}
.pin.hl .dot,.pin:hover .dot{transform:scale(1.5);box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 7px var(--c),0 4px 10px rgba(0,0,0,.4)}
.pin.hl{animation:bounce .6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.pin .dot{transition:transform .15s,box-shadow .15s}
@media (prefers-reduced-motion:reduce){.pin.hl{animation:none}}
.row.hl{background:var(--hover);box-shadow:inset 3px 0 0 var(--c)}

.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.phead{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.meta button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:1px 8px;font-family:var(--sans);font-size:12px}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 7px;text-align:left;display:grid;opacity:.5;transition:opacity .15s}
.chip[aria-pressed="true"]{opacity:1;border-color:var(--c);background:var(--cbg)}
.chip b{font-family:var(--mono);font-size:20px;line-height:1.2;color:var(--c)}
.chip span{font-size:11px;line-height:1.3}
.tools input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.notice{font-size:12px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--week-bg)}
.notice.err{background:#FBE9E6;color:#C0392B}
.pbody{overflow:auto;flex:1;min-height:0}
.group h2{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.08em;margin:0;padding:12px 16px 4px;position:sticky;top:0;background:var(--panel);z-index:1}
.row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 10px;padding:9px 16px 9px 12px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:hover{background:var(--hover)}
.row .stripe{grid-row:1/3;border-radius:2px;background:var(--c)}
.row .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .loc{font-size:12px;color:var(--muted);white-space:nowrap}
.row .sub{grid-column:2/4;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub.issue{color:var(--issue)}
.dbadge{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--c);color:#fff}
.empty{padding:24px 16px;color:var(--muted);font-size:13px}

.detail{padding:16px;display:grid;gap:14px}
.back{border:0;background:none;color:var(--accent);padding:0;justify-self:start;font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--cbg);color:var(--c);border:1px solid var(--c)}
.detail h3{font-size:20px;margin:4px 0 0}
.kv{display:grid;grid-template-columns:5em 1fr;gap:6px 10px;margin:0}
.kv dt{color:var(--muted);font-size:12px;padding-top:2px}
.kv dd{margin:0;word-break:break-word}
.issuebox{background:var(--issue-bg);border:1px solid var(--issue);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.note{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.mono{font-family:var(--mono);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.leaflet-container{font-family:var(--sans)}
.fitbtn.g{top:auto;bottom:120px}
/* ---------- 排路線 ---------- */
.tools{display:flex;gap:8px}
.tools input{flex:1;min-width:0}
.routebtn{border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:8px;padding:7px 12px;white-space:nowrap;font-weight:500}
.routebtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.routebox{margin:12px 16px;border:1.5px solid var(--accent);border-radius:10px;padding:12px;display:grid;gap:10px;background:#F4FAF8}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rhead b{font-size:15px}
.rhead span{font-size:12px;color:var(--muted)}
.fromme{display:flex;align-items:center;gap:6px;font-size:13px}
.stops{list-style:none;margin:0;padding:0;display:grid;gap:0}
.stops li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.stops li:first-child{border-top:0}
.stops .n{grid-row:1/3;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--mono);font-size:12px;display:grid;place-items:center}
.stops .n.me{background:#1F63E0}
.stops .nm2{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stops .leg{grid-column:2/3;font-size:12px;color:var(--muted);font-family:var(--mono)}
.stops .ops{grid-row:1/3;grid-column:3;display:flex;gap:4px}
.stops .ops button{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:28px;height:28px;font-size:13px;line-height:1}
.rtotal{font-size:13px;background:var(--panel);border-radius:8px;padding:8px 10px;border:1px solid var(--line)}
.rtotal b{font-family:var(--mono);font-size:15px}
.rempty{font-size:13px;color:var(--muted)}
.ractions{display:flex;flex-wrap:wrap;gap:6px}
.ractions .btn{padding:7px 12px;font-size:13px}
.row.instop{background:#F4FAF8}
.row .stopno{font-family:var(--mono);font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px}
.pin .num{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;z-index:2}
.pin.stop .lbl.hide{display:block}
.mepin{position:relative;width:0;height:0}
.mepin i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:#1F63E0;border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,99,224,.25)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:2000;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
body.routing #map .leaflet-interactive{cursor:pointer}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto;min-height:100%}
  #v-map{overflow:auto}
  .brand{display:none}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .pbody{overflow:visible}
  .legend{font-size:11px;padding:6px 10px;bottom:20px}
}

/* ---------- 今日排班 ---------- */
.page{max-width:1100px;margin:0 auto;padding-block:16px 40px;padding-inline:16px;display:grid;gap:14px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.pagehead h2{margin:0;font-size:22px}
.pagehead h2 small{font-size:14px;color:var(--muted);font-weight:500;margin-left:8px}
.rest{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.rest span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.rest b{font-weight:500;color:var(--muted);margin-right:6px}
.crews{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.crew{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid}
.crew .ch{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:2px;background:#F7F9F6}
.crew .site{font-size:17px;font-weight:700;line-height:1.35}
.crew .th{font-size:13px;color:var(--muted)}
.crew .cb{padding:12px 14px;display:grid;gap:10px}
.kvrow{display:grid;grid-template-columns:4.5em 1fr;gap:6px;align-items:start;font-size:14px}
.kvrow>span:first-child{color:var(--muted);font-size:12px;padding-top:3px}
.ppl{display:flex;flex-wrap:wrap;gap:5px}
.ppl i{font-style:normal;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:13px}
.ppl i.lead{background:var(--accent);color:#fff;border-color:var(--accent)}
.car{font-family:var(--mono);font-size:13px;background:#FFF4DB;border:1px solid #F2C46D;border-radius:6px;padding:1px 8px}
.tasks{display:flex;flex-wrap:wrap;gap:6px}
.task{border:1px solid var(--line);border-radius:8px;padding:3px 9px;display:grid;line-height:1.3}
.task b{font-weight:500;font-size:13px}
.task small{color:var(--muted);font-size:12px}
.crew .note{background:#FFF8E6;border-radius:8px;padding:6px 10px;font-size:13px}
.crew .cf{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.crew .cf .btn{padding:6px 12px;font-size:13px}
.nomatch{font-size:12px;color:var(--muted)}
.need{display:flex;flex-wrap:wrap;gap:5px}
.need i{font-style:normal;font-size:12px;border-radius:6px;padding:1px 7px;background:#E5F4E8;color:#1E6B34}
.need i.low{background:#FEF3C7;color:#8A5A00}
.need i.out{background:#FDE2E2;color:#B42318}
/* ---------- 庫存 ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;text-align:left}
.tile b{font-family:var(--mono);font-size:26px;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.tile.out b{color:#B42318}.tile.low b{color:#B7791F}.tile.need b{color:#1E6B34}
button.tile[aria-pressed="true"]{outline:2px solid var(--accent)}
.sbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 14px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.sbar input{flex:1;min-width:160px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px}
.stbl{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,.7fr)) minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.srow.h{border-top:0;background:#F7F9F6;font-size:12px;color:var(--muted);font-weight:500}
.srow .nm b{font-weight:500}
.srow .nm small{display:block;color:var(--muted);font-size:12px}
.srow .num{font-family:var(--mono);text-align:right}
.srow .num.neg{color:#B42318;font-weight:700}
.srow .tot{font-weight:700}
.st{justify-self:start;font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.out{background:#FDE2E2;color:#B42318}.st.low{background:#FEF3C7;color:#8A5A00}.st.ok{background:#E5F4E8;color:#1E6B34}.st.idle{background:#EEF0EF;color:#63706F}
.tag2{font-size:11px;background:#FFF4DB;border:1px solid #F2C46D;border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.foot{font-size:12px;color:var(--muted)}
.errbox{background:#FDE2E2;color:#B42318;border-radius:10px;padding:12px 14px;font-size:13px}
@media (max-width:760px){
  .srow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .srow.h{display:none}
  .srow .nm{grid-column:1/3}
  .srow .num::before{content:attr(data-l);color:var(--muted);font-family:var(--sans);font-size:11px;margin-right:4px}
  .srow .num{text-align:left}
  .srow>*:nth-child(n+2){font-size:13px}
  .crews{grid-template-columns:1fr}
}

/* ---------- 網站填寫 ---------- */
.loginbtn{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:999px;padding:5px 14px;font-size:13px;white-space:nowrap}
.loginbtn.on{background:#fff;color:var(--accent);font-weight:500}
.mini{border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:6px;padding:3px 10px;font-size:12px}
.modal-bg{position:fixed;inset:0;background:rgba(20,28,30,.45);z-index:3000;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);display:grid}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.modal header h3{margin:0;font-size:17px}
.modal header button{border:0;background:none;font-size:20px;line-height:1;padding:4px 8px}
.modal .mb{padding:16px 18px;display:grid;gap:12px}
.modal .mf{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line)}
.fld{display:grid;gap:4px}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;font:inherit}
.fld textarea{min-height:80px;resize:vertical}
.fld .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.segs button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:13px}
.segs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

<script>
(function(){
const CFG=window.FULIN_CONFIG;
let todayBySite={},sched=null,stock=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BUCKETS=[
  {k:'issue',label:'問題單',c:'--issue',bg:'--issue-bg'},
  {k:'active',label:'進場中',c:'--active',bg:'--active-bg'},
  {k:'week',label:'7 天內進場',c:'--week',bg:'--week-bg'},
  {k:'later',label:'待安排',c:'--later',bg:'--later-bg'},
  {k:'done',label:'已完工',c:'--done',bg:'--done-bg'}
];
const BK=Object.fromEntries(BUCKETS.map(b=>[b.k,b]));

// ---------- parsing ----------
function parseStatus(v){v=String(v||'');
  if(/問題|異常|客訴|維修/.test(v))return 'issue';
  if(/完工|結案|完成/.test(v))return 'done';
  if(/進場中|施工/.test(v))return 'active';
  if(/預定|進場|待/.test(v))return 'upcoming';
  return 'active'}
function pad(n){return String(n).padStart(2,'0')}
function parseDate(cell){if(!cell)return '';const v=cell.v;
  if(typeof v==='string'){let m=v.match(/^Date\((\d+),(\d+),(\d+)/);if(m)return m[1]+'-'+pad(+m[2]+1)+'-'+pad(m[3]);
    m=v.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
    m=v.match(/^(\d{1,2})\D(\d{1,2})$/);if(m)return new Date().getFullYear()+'-'+pad(m[1])+'-'+pad(m[2])}
  if(cell.f){const m=cell.f.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3])}
  return ''}
function parseCoord(v){v=String(v||'');let m=v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||v.match(/(-?\d{1,3}\.\d+)\s*[,，\s]\s*(-?\d{1,3}\.\d+)/);
  if(!m)return null;let a=+m[1],b=+m[2];if(a>90)[a,b]=[b,a];if(a<20||a>27||b<117||b>123)return null;return [a,b]}
function cellText(c){if(!c)return '';if(c.f!=null&&typeof c.v!=='string')return String(c.f);return c.v==null?'':String(c.v)}

const COLS={name:['案名','名稱','案場'],status:['狀態'],startDate:['進場日','進場日期','預定進場'],address:['地址'],coord:['座標','位置','經緯度'],
  owner:['負責人'],contact:['聯絡人'],phone:['電話','聯絡電話'],issue:['問題描述','問題','備註']};
function rowsFromTable(t){
  const labels=t.cols.map(c=>String(c.label||'').trim());
  const idx={};for(const k in COLS){idx[k]=labels.findIndex(l=>COLS[k].some(n=>l===n||l.startsWith(n)))}
  const out=[];
  t.rows.forEach((r,i)=>{const c=r.c||[];const g=k=>idx[k]>=0?c[idx[k]]:null;
    const name=cellText(g('name')).trim();if(!name)return;
    const co=parseCoord(cellText(g('coord')));

function daysUntil(ds){if(!ds)return null;const [y,m,d]=ds.split('-').map(Number);const t=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/864e5)}

function leafletAdapter(){

    mapTypeControl:true,mapTypeControlOptions:{position:ControlPosition.TOP_LEFT},streetViewControl:false,fullscreenControl:false,
    zoomControlOptions:{position:ControlPosition.RIGHT_TOP}});
  class HtmlMarker extends OverlayView{
    constructor(lat,lng,html,z,title,onClick){super();this.pos={lat,lng};const d=document.createElement('div');
      d.style.cssText='position:absolute;cursor:pointer;z-index:'+z;d.title=title;d.innerHTML=html;
      d.addEventListener('click',e=>{e.stopPropagation();onClick()});this.div=d;OverlayView.preventMapHitsAndGesturesFrom(d)}
    onAdd(){this.getPanes().overlayMouseTarget.appendChild(this.div)}
    draw(){const p=this.getProjection().fromLatLngToDivPixel(this.pos);if(p){this.div.style.left=p.x+'px';this.div.style.top=p.y+'px'}}

  return {kind:'google',
    resize:()=>{},
    setView:(lat,lng,z)=>{map.setCenter({lat,lng});map.setZoom(z)},
    zoom:()=>map.getZoom(),
    fit:pts=>{const b=new LatLngBounds();pts.forEach(p=>b.extend({lat:p[0],lng:p[1]}));map.fitBounds(b,40);
      google.maps.event.addListenerOnce(map,'idle',()=>{if(map.getZoom()>14)map.setZoom(14)})},
    clear:()=>{markers.forEach(m=>m.setMap(null));markers=[]},
    line:(pts,me)=>{poly.forEach(p=>p.setMap(null));poly=[];if(meM){meM.setMap(null);meM=null}
      const path=pts.map(p=>({lat:p[0],lng:p[1]}));

      if(me){meM=new HtmlMarker(me[0],me[1],'<div class="mepin"><i></i></div>',1,'目前位置',()=>{});meM.setMap(map)}},
    add:(lat,lng,html,z,title,onClick)=>{const m=new HtmlMarker(lat,lng,html,z,title,onClick);m.setMap(map);markers.push(m);return {front:on=>{m.div.style.zIndex=on?100000:z}}}};

// ---------- 排路線：連線、估算路程、分享 ----------
let routeMode=false,route=[],fromMe=false,myPos=null;
try{fromMe=localStorage.getItem('fulin-route-fromme')==='1'}catch(e){}
const siteKey=s=>s.name+'@'+(s.lat!=null?s.lat.toFixed(4)+','+s.lng.toFixed(4):'');
function saveRoute(){try{localStorage.setItem('fulin-route',JSON.stringify(route.map(id=>siteKey(sites.find(x=>x.id===id))).filter(Boolean)));localStorage.setItem('fulin-route-fromme',fromMe?'1':'0')}catch(e){}}

function toggleStop(id){const s=sites.find(x=>x.id===id);if(!s)return;

function km(a,b){const R=6371,r=Math.PI/180,dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;

// 路程估算：直線距離 × 1.35（道路繞行係數），平均時速 50 公里
function roadKm(a,b){return km(a,b)*1.35}
function mins(k){return Math.max(5,Math.round(k/50*60/5)*5)}
function fmtMin(m){const h=Math.floor(m/60),mm=m%60;return h?(h+' 小時'+(mm?' '+mm+' 分':'')):(mm+' 分')}
function stopPts(){return route.map(id=>sites.find(x=>x.id===id)).filter(s=>s&&s.lat!=null)}
function legs(){const st=stopPts();const pts=st.map(s=>[s.lat,s.lng]);if(fromMe&&myPos)pts.unshift(myPos);
  const out=[];for(let i=1;i<pts.length;i++){const k=roadKm(pts[i-1],pts[i]);out.push({k,m:mins(k)})}return out}
function drawRouteLine(){if(!M||!M.line)return;const pts=stopPts().map(s=>[s.lat,s.lng]);
  if(routeMode&&fromMe&&myPos&&pts.length)pts.unshift(myPos);M.line(routeMode||route.length?pts:[],fromMe&&myPos&&routeMode?myPos:null)}
function routeHtml(){const st=stopPts();const lg=legs();const off=(fromMe&&myPos)?1:0;
  let h='<div class="routebox"><div class="rhead"><b>出車路線</b><span>點地圖標記或下方列表，依序加入站點</span></div>'+
   '<label class="fromme"><input type="checkbox" data-r="fromme" id="fromMe"'+(fromMe?' checked':'')+'> 從我目前的位置出發'+(fromMe&&!myPos?'（定位中…）':'')+'</label>';

      (i?'<button data-r="up" data-id="'+s.id+'" title="往前移" aria-label="往前移">↑</button>':'')+

  const links=gmapsLinks();
  h+='<div class="ractions">'+(st.length>1?'<button class="btn" data-r="opt">自動排成最順路線</button>':'')+
    links.map((u,i)=>'<a class="btn primary" href="'+u+'" target="_blank" rel="noopener">Google 導航'+(links.length>1?'（第 '+(i+1)+' 段）':'')+'</a>').join('')+

// Google 地圖網址一次最多帶 9 個中途點，超過就分段
function gmapsLinks(){const st=stopPts();if(!st.length)return[];const P=s=>s.lat.toFixed(6)+','+s.lng.toFixed(6);
  const pts=st.map(P);const useMe=fromMe;const out=[];let i=0;
  while(i<pts.length){const first=i===0;const origin=first?(useMe?null:pts[0]):pts[i-1];
    const startIdx=first&&!useMe?1:i;const seg=pts.slice(startIdx,startIdx+10);if(!seg.length)break;
    const dest=seg[seg.length-1],wps=seg.slice(0,-1);
    let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(dest);
    if(origin)u+='&origin='+encodeURIComponent(origin);if(wps.length)u+='&waypoints='+encodeURIComponent(wps.join('|'));

  return out}
function optimize(){let st=stopPts();if(st.length<3&&!(fromMe&&myPos))return;
  const start=(fromMe&&myPos)?myPos:[st[0].lat,st[0].lng];let rest=(fromMe&&myPos)?st.slice():st.slice(1);const ord=(fromMe&&myPos)?[]:[st[0]];
  let cur=start;while(rest.length){let bi=0,bd=1e9;rest.forEach((s,i)=>{const d=km(cur,[s.lat,s.lng]);if(d<bd){bd=d;bi=i}});const n=rest.splice(bi,1)[0];ord.push(n);cur=[n.lat,n.lng]}
  // 2-opt 微調
  const pt=s=>[s.lat,s.lng];const fixed=(fromMe&&myPos)?0:1;let improved=true,guard=0;
  const D=(a,b)=>km(a,b);
  while(improved&&guard++<50){improved=false;
    for(let i=fixed;i<ord.length-1;i++)for(let j=i+1;j<ord.length;j++){
      const a=i===0?start:pt(ord[i-1]),b=pt(ord[i]),c=pt(ord[j]),d=j+1<ord.length?pt(ord[j+1]):null;

     '<table style="font-size:'+fs.toFixed(1)+'px"><colgroup><col style="width:28px"><col style="width:52px"><col style="width:13%"><col style="width:40px"><col style="width:15%">'+days.map(()=>'<col>').join('')+'<col style="width:50px"><col style="width:58px"></colgroup>'+

     list.map(i=>'<tr style="height:'+rh.toFixed(2)+'mm"><td class="no">'+i.order+'</td><td class="cur">'+fmtN(pl==='大倉'?i.big:i.oil)+'</td><td class="nm">'+esc((i.section?i.section.replace('大浴室','大衛浴')+'・':'')+i.name)+'</td><td class="sp">'+esc(i.spec||'')+'</td><td class="th">'+esc(i.thai||'')+'</td>'+
       days.map(()=>'<td></td>').join('')+'<td class="sum"></td><td class="cnt"></td></tr>').join('')+
     '</tbody></table><div class="ft"><span>倉管簽名 ลายเซ็น：＿＿＿＿＿＿＿</span><span>核對 ตรวจสอบ：＿＿＿＿＿＿＿</span><span>進貨請寫在背面 รับของเข้าเขียนด้านหลัง</span></div></div>'}));

function sheetInit(){if(!wk){const types=[...new Set(stockItems.map(i=>i.type))];wk={place:'大倉',type:types[0]||'牆板',from:mondayOf(DB.today),grid:{},ai:{},data:null,loading:false,dirty:false}}
  if((!wk.data||wk.stale)&&!wk.loading){wk.stale=false;loadWeek()}}
async function openWeek(){stockMode='sheet';sheetInit();renderStock()}
async function loadWeek(){const ck='fulin-wk|'+wk.place+'|'+wk.from;
  if(!wk.data){try{const c=JSON.parse(localStorage.getItem(ck)||'null');if(c)fillWeek(c)}catch(e){}}
  wk.loading=true;renderSheet();
  try{const r=await fetch(CFG.API_URL+'?action=week&place='+encodeURIComponent(wk.place)+'&from='+wk.from+'&t='+Date.now());const j=await readJson(r);if(!j.ok)throw new Error(j.error);
    if(wk.dirty){wk.loading=false;renderSheet();return}fillWeek(j.data);try{localStorage.setItem(ck,JSON.stringify(j.data))}catch(e){}}
  catch(e){if(!wk.data)wk.data={entries:{},counts:{},other:{},err:e.message};toast('讀不到這週資料：'+e.message)}
  wk.loading=false;wk.dirty=false;renderSheet()}
// 每列的三個數字：週初結存／已出貨／庫存（含還沒儲存的修改）
function sheetNums(i){const D=wk.data||{};const days=weekDays(wk.from);const g=wk.grid[i.id]||{days:{}};
  const saved=days.reduce((a,d)=>a+(Number((D.entries||{})[i.id]?.[d])||0),0);const now=days.reduce((a,d)=>a+(Number(g.days[d])||0),0);const diff=now-saved;
  const cur=wk.place==='大倉'?i.big:i.oil;
  if(D.start){const st=D.start[i.id]||0;const out=(D.out[i.id]||0)+diff;const end=st+(D.net[i.id]||0)-diff;return {st,out,end}}
  return {st:null,out:now,end:cur-diff}}
function renderSheet(){const el=$('stockPage');if(!wk)return;const days=weekDays(wk.from);const types=[...new Set(stockItems.map(i=>i.type))];const A=isAdmin();
  const alerts=stockItems.filter(i=>i.st==='out'||i.st==='neg'||i.st==='low').length;const d0=toDate(days[0]),d6=toDate(days[6]);

   '<div class="wknav"><button class="btn" data-w="prev" aria-label="上一週">‹</button><span>'+(d0.getMonth()+1)+'/'+d0.getDate()+' ～ '+(d6.getMonth()+1)+'/'+d6.getDate()+'</span><button class="btn" data-w="next" aria-label="下一週">›</button>'+
     (wk.from!==mondayOf(DB.today)?'<button class="btn" data-w="thisweek">回本週</button>':'')+'</div>'+
   (A?'<div class="shsave"><button class="btn" data-w="photo">📷 拍照填入</button><button class="btn primary" data-w="save"'+(wk.dirty?'':' disabled')+'>'+(wk.dirty?'儲存修改':'已儲存')+'</button></div>':'')+
   '<input type="file" id="wkPhoto" accept="image/*" hidden></div>';
  if(wk.loading&&!wk.data){el.innerHTML=h+'<div class="foot">讀取中…</div>';return}
  const list=itemsOfTypes([wk.type]);const today=DB.today;const O=(wk.data&&wk.data.other)||{};

  h+='<div class="boardwrap"><table class="sheet"><thead>'+

   '<tr><th rowspan="2" class="n">'+(hasStart?(d0.getMonth()+1)+'/'+d0.getDate()+'前':'')+'</th><th rowspan="2" class="n">已出貨</th><th rowspan="2" class="n">庫存</th><th colspan="3" rowspan="2" class="it">品項/รายการวัสดุ</th>'+
     days.map(d=>{const x=toDate(d);return '<th class="dd'+(d===today?' td':'')+'">'+(x.getMonth()+1)+'/'+x.getDate()+'</th>'}).join('')+'<th rowspan="2" class="cc">盤點<br>實數</th></tr>'+
   '<tr>'+days.map(d=>'<th class="wd'+(d===today?' td':'')+'">'+WK[toDate(d).getDay()]+'</th>').join('')+'</tr></thead><tbody>'+
   list.map((i,r)=>{const g=wk.grid[i.id]||{days:{},count:''};const n=sheetNums(i);const AI=wk.ai[i.id]||{};
     return '<tr><td class="n st">'+(n.st==null?'':fmtN(n.st))+'</td><td class="n out" id="so-'+i.id+'">'+(n.out?'-'+fmtN(n.out):'0')+'</td><td class="n bal'+(n.end<0?' neg':'')+'" id="sb-'+i.id+'">'+fmtN(n.end)+'</td>'+
     '<td class="nm"><button data-w="item" data-v="'+i.id+'">'+esc((i.section?i.section.replace('大浴室','大衛浴')+'・':'')+i.name)+'</button></td><td class="sp">'+esc(i.spec||'')+'</td><td class="th">'+esc(i.thai||'')+'</td>'+
     days.map((d,c)=>{const v=g.days[d]??'';const o=O[i.id]&&O[i.id][d];
       return '<td class="c'+(d===today?' td':'')+'">'+(A?'<input inputmode="numeric" data-it="'+i.id+'" data-d="'+d+'" data-r="'+r+'" data-c="'+c+'" value="'+esc(v)+'"'+(AI[d]?' class="ai"':'')+'>':'<span>'+esc(v)+'</span>')+
         (o?'<small title="網站單筆登記的出貨">登'+fmtN(o)+'</small>':'')+'</td>'}).join('')+
     '<td class="c cc">'+(A?'<input inputmode="numeric" data-it="'+i.id+'" data-d="count" data-r="'+r+'" data-c="7" value="'+esc(g.count??'')+'"'+(AI.count?' class="ai"':'')+'>':'<span>'+esc(g.count)+'</span>')+'</td></tr>'}).join('')+
   (list.length?'':'<tr><td colspan="14" class="foot">這個類別還沒有品項</td></tr>')+'</tbody></table></div>'+
   '<div class="foot">格子裡填的是「當天出貨數量」。'+(hasStart?'第一欄是這週一之前的結存，':'')+'「庫存」會跟著你填的數字即時變動，按「儲存修改」才會存進去。'+
   '「盤點實數」有填的話，會自動補一筆盤點調整，讓帳面等於實際數量。小字「登N」是現場在網站上單筆登記的出貨。黃色格子是 AI 從照片讀出來的，請核對。點品名可以看紀錄、登記進貨。</div>';
  const sx=(el.querySelector('.boardwrap')||{}).scrollLeft||0;const ae=document.activeElement;const key=ae&&ae.dataset&&ae.dataset.it?ae.dataset.it+'|'+ae.dataset.d:'';
  el.innerHTML=h;const bw=el.querySelector('.boardwrap');if(bw)bw.scrollLeft=sx;
  if(key){const [it,d]=key.split('|');const x=el.querySelector('input[data-it="'+it+'"][data-d="'+d+'"]');if(x)x.focus()}}
function renderWeek(){return renderSheet()}
function fillWeek(d){wk.data=d;d.entries=d.entries||{};d.counts=d.counts||{};wk.grid={};wk.ai={};stockItems.forEach(i=>{const e=d.entries[i.id]||{};const c=d.counts[i.id];wk.grid[i.id]={days:Object.assign({},e),count:c==null?'':String(c)}})}
function weekInput(e){const t=e.target;if(!t.dataset.it)return;const g=wk.grid[t.dataset.it]=wk.grid[t.dataset.it]||{days:{},count:''};
  const v=t.value.replace(/[^\d.\-]/g,'');if(t.dataset.d==='count')g.count=v;else g.days[t.dataset.d]=v;t.classList.remove('ai');
  const it=stockItems.find(x=>x.id===t.dataset.it);if(it){const n=sheetNums(it);const o=$('so-'+it.id),b=$('sb-'+it.id);if(o)o.textContent=n.out?'-'+fmtN(n.out):'0';if(b){b.textContent=fmtN(n.end);b.classList.toggle('neg',n.end<0)}}
  if(!wk.dirty){wk.dirty=true;const s=document.querySelector('[data-w="save"]');if(s){s.disabled=false;s.textContent='儲存修改'}}}
// 像試算表一樣用 Enter／方向鍵移動
function sheetKey(e){const t=e.target;if(!t.dataset||t.dataset.r===undefined)return;let r=+t.dataset.r,c=+t.dataset.c;
  if(e.key==='Enter'||e.key==='ArrowDown')r+=e.shiftKey&&e.key==='Enter'?-1:1;else if(e.key==='ArrowUp')r--;
  else if(e.key==='ArrowRight'&&t.selectionStart===t.value.length)c++;else if(e.key==='ArrowLeft'&&t.selectionStart===0)c--;else return;
  const x=document.querySelector('#stockPage input[data-r="'+r+'"][data-c="'+c+'"]');if(x){e.preventDefault();x.focus();x.select()}}
$('stockPage').addEventListener('keydown',e=>{if(stockMode==='sheet')sheetKey(e)});
$('stockPage').addEventListener('focusin',e=>{if(stockMode==='sheet'&&e.target.dataset&&e.target.dataset.r!==undefined)e.target.select()});
async function weekClick(e){const b=e.target.closest('[data-w]');if(!b)return;const w=b.dataset.w;
  const leave=()=>!wk.dirty||confirmStep('leave-week');const stay=()=>toast('還沒儲存，再按一次就放棄修改');
  if(w==='alerts'){if(!leave())return stay();wk.dirty=false;stockMode='list';stFilter='out';renderStock();return}
  if(w==='newitem'){openItemModal(null);return}
  if(w==='print'){printWeek(wk.from,[wk.place],[wk.type]);return}
  if(w==='item'){openHistory(stockItems.find(x=>x.id===b.dataset.v));return}
  if(w==='prev'||w==='next'||w==='thisweek'){if(!leave())return stay();wk.from=w==='thisweek'?mondayOf(DB.today):addDays(wk.from,w==='prev'?-7:7);wk.data=null;return loadWeek()}
  if(w==='place'){if(wk.place===b.dataset.v)return;if(!leave())return stay();wk.place=b.dataset.v;wk.data=null;return loadWeek()}
  if(w==='type'){wk.type=b.dataset.v;renderSheet();return}
  if(w==='photo'){const inp=$('wkPhoto');inp.onchange=async()=>{const f=inp.files[0];if(!f)return;b.disabled=true;b.textContent='AI 辨識中…（約 20 秒）';
      try{const img=await shrink2(f,2200);const days=weekDays(wk.from);const d=(await api('week_ocr',{image:img,dates:days})).data;
        let n=0;(d.rows||[]).forEach(r=>{const it=stockItems.find(i=>i.order===Number(r.no));if(!it)return;const g=wk.grid[it.id]=wk.grid[it.id]||{days:{},count:''};const A=wk.ai[it.id]=wk.ai[it.id]||{};
          (r.days||[]).forEach((q,k)=>{if(q!==null&&q!==''&&!isNaN(Number(q))){g.days[days[k]]=String(q);A[days[k]]=1;n++}});
          if(r.count!==null&&r.count!==undefined&&!isNaN(Number(r.count))){g.count=String(r.count);A.count=1;n++}});
        wk.dirty=n>0||wk.dirty;renderSheet();toast(n?'AI 讀到 '+n+' 格，請核對黃色格子後按「儲存修改」':'AI 沒讀到數字，請確認照片清楚、是這週的表')}
      catch(err){toast(err.message);b.disabled=false;b.textContent='📷 拍照填入'}inp.value=''};inp.click();return}
  if(w==='save'){b.disabled=true;b.textContent='儲存中…';
    try{const rows=Object.keys(wk.grid).map(id=>({itemId:id,days:wk.grid[id].days,count:wk.grid[id].count}));
      const d=(await api('week_save',{place:wk.place,from:wk.from,rows})).data;wk.dirty=false;toast('已儲存（'+d.outs+' 筆出貨）');await load()}
    catch(err){toast(err.message);b.disabled=false;b.textContent='儲存修改'}}}
function shrink2(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
  const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res({type:'image/jpeg',data:cv.toDataURL('image/jpeg',.85).split(',')[1]})};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

let mdraft=null,mdirty=false;
function renderManage(){const el=$('managePage');if(!isAdmin()){el.innerHTML='';return}
  if(!mdraft||!mdirty)mdraft={people:DB.people.map(p=>({name:p.name,kind:p.kind})),cars:DB.cars.map(c=>({name:c})),tasks:DB.tasks.map(t=>({zh:t.zh,th:t.th}))};
  const kinds=['帶頭','工人','其他'];
  el.innerHTML='<div class="pagehead"><h2>管理<small>名單與設定</small></h2>'+(DB.sheetUrl?'<a class="btn" href="'+DB.sheetUrl+'" target="_blank" rel="noopener">打開資料庫試算表（備份）</a>':'')+'</div>'+
  '<div class="mgrid">'+
  '<div class="mcard"><h3>人員 <button class="btn primary" data-ms="people">儲存</button></h3>'+mdraft.people.map((p,i)=>'<div class="lrow"><input data-mk="people" data-i="'+i+'" data-f="name" value="'+esc(p.name)+'"><select data-mk="people" data-i="'+i+'" data-f="kind">'+kinds.map(k=>'<option'+(k===p.kind?' selected':'')+'>'+k+'</option>').join('')+'</select><button data-mdel="people" data-i="'+i+'" aria-label="刪除">×</button></div>').join('')+'<button class="btn" data-madd="people">＋ 新增人員</button></div>'+
  '<div class="mcard"><h3>車輛 <button class="btn primary" data-ms="cars">儲存</button></h3>'+mdraft.cars.map((p,i)=>'<div class="lrow" style="grid-template-columns:1fr auto"><input data-mk="cars" data-i="'+i+'" data-f="name" value="'+esc(p.name)+'"><button data-mdel="cars" data-i="'+i+'" aria-label="刪除">×</button></div>').join('')+'<button class="btn" data-madd="cars">＋ 新增車輛</button></div>'+
  '<div class="mcard"><h3>施作項目（中／泰） <button class="btn primary" data-ms="tasks">儲存</button></h3><div class="foot">泰文留空，儲存時會自動翻譯。</div>'+mdraft.tasks.map((p,i)=>'<div class="lrow t2"><input data-mk="tasks" data-i="'+i+'" data-f="zh" value="'+esc(p.zh)+'"><input data-mk="tasks" data-i="'+i+'" data-f="th" value="'+esc(p.th)+'"><button data-mdel="tasks" data-i="'+i+'" aria-label="刪除">×</button></div>').join('')+'<button class="btn" data-madd="tasks">＋ 新增項目</button></div>'+
  '</div><div class="foot">密碼在 Apps Script 的「指令碼屬性」修改：ADMIN_PIN（管理）、FIELD_PIN（現場）。每一筆寫入都記錄在資料庫的「紀錄」分頁。</div>'}
$('managePage').addEventListener('input',e=>{const t=e.target;if(t.dataset.mk)mdirty=true,mdraft[t.dataset.mk][+t.dataset.i][t.dataset.f]=t.value});
$('managePage').addEventListener('change',e=>{const t=e.target;if(t.dataset.mk)mdirty=true,mdraft[t.dataset.mk][+t.dataset.i][t.dataset.f]=t.value});
$('managePage').addEventListener('click',async e=>{const a=e.target.closest('[data-madd]');if(a){const k=a.dataset.madd;mdirty=true;mdraft[k].push(k==='people'?{name:'',kind:'工人'}:k==='cars'?{name:''}:{zh:'',th:''});renderManage();return}
  const d=e.target.closest('[data-mdel]');if(d){mdirty=true;mdraft[d.dataset.mdel].splice(+d.dataset.i,1);renderManage();return}
  const s=e.target.closest('[data-ms]');if(s){const k=s.dataset.ms;s.disabled=true;s.textContent='儲存中…';
    try{await api('list_save',{kind:k,rows:mdraft[k].filter(x=>(x.name||x.zh||'').trim())});toast('已儲存');mdraft=null;mdirty=false;await load();renderManage()}catch(err){toast(err.message);s.disabled=false;s.textContent='儲存'}}});

// ================= 啟動 =================
setAdminUI();
showTab((location.hash||'#map').slice(1));
initMap();render();
// 先用上次的資料立刻顯示，同時在背景抓最新的
(function(){try{const c=JSON.parse(localStorage.getItem('fulin-db')||'null');if(c&&c.sites){DB=c;applyData();$('updated').textContent='更新中…'}}catch(e){}})();
load();
setInterval(()=>{if(!schedEdit&&!document.getElementById('modalBg'))load()},(CFG.REFRESH_MINUTES||5)*60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!schedEdit&&!document.getElementById('modalBg'))load()});
})();
</script>
</body>
</html>
