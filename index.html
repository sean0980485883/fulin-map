<!doctype html>
<html lang="zh-Hant" translate="no" class="notranslate">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>富林組合屋工作台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<meta name="theme-color" content="#15202B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.FULIN_CONFIG = {
  // 後台網址：「富林系統資料庫」Apps Script 部署後的網址（…/exec）
  API_URL: "https://script.google.com/macros/s/AKfycbyX1V9nAHC-CmVTxYR4trAOsx_sjuqYkgivZa3GlWFff7m9hCgeCWdngpZU91qgUuDpkw/exec",
  GOOGLE_MAPS_KEY: "",   // 貼上 Google 地圖 API 金鑰；留空則使用備用底圖（Esri）
  REFRESH_MINUTES: 5
};
</script>
<style>
:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --ink:#1E2A2C; --muted:#63706F; --line:#DCE0DA; --hover:#EEF2EB;
  --accent:#1F5C55; --accent-ink:#FFFFFF;
  --issue:#1E1E1E; --active:#2E9E44; --week:#1F63E0; --later:#79A6EE; --done:#9AA3A2;
  --issue-bg:#ECECEC; --active-bg:#E5F4E8; --week-bg:#E4EDFC; --later-bg:#EEF3FD; --done-bg:#EEF0EF;
  --shadow:0 6px 24px rgba(30,42,44,.14);
  --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.page{grid-template-columns:minmax(0,1fr)}
.topbar,.tabs{min-width:0}
.topbar{display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--accent);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.brand{font-weight:700;font-size:15px;letter-spacing:.04em;white-space:nowrap;padding:12px 0}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{border:0;background:none;color:rgba(255,255,255,.75);padding:14px 14px 11px;font-size:14px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
.tab .cnt{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.2);border-radius:999px;padding:1px 7px;margin-left:6px}
.tab .cnt.bad{background:#E5484D;color:#fff}
.view{min-height:0;overflow:auto}
#v-map{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.pin .dot.star{left:-13px;top:-13px;width:26px;height:26px;font-size:17px;color:#FFC400;text-shadow:0 0 1px #7a5a00;border-width:3px;border-color:#FFC400}
.pin.hl .dot.star,.pin:hover .dot.star{transform:scale(1.35)}
.row .star{color:#E0A800;margin-right:4px}
.legend .lstar{color:#E0A800;font-size:14px;line-height:1}
.pin .today{position:absolute;left:10px;top:-26px;background:#F59E0B;color:#1E1E1E;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;border:1.5px solid #fff;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
#map{height:100%;width:100%;background:#E6EAE4}
.mapwrap{position:relative;min-height:0}
.legend{position:absolute;left:12px;bottom:24px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.fitbtn{position:absolute;right:10px;top:86px;z-index:500;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}

.pin{position:relative;width:0;height:0}
.pin .dot{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;line-height:1}
.pin.sel .dot{left:-12px;top:-12px;width:24px;height:24px;border-color:var(--ink)}
.pin .halo{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;border:2px solid var(--issue);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin .halo{animation:none;opacity:.35}}
.pin .tag{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--c);color:#fff;font-family:var(--mono);font-size:11px;padding:0 6px;border-radius:4px;border:1.5px solid #fff;white-space:nowrap;line-height:16px}
.pin .lbl{position:absolute;left:14px;top:-9px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.pin .lbl.hide{display:none}
/* 滑到列表或標記時：放大、跳動、顯示名稱 */
.pin.hl .lbl,.pin:hover .lbl{display:block;background:var(--ink);color:#fff;text-shadow:none;padding:2px 8px;border-radius:6px;top:-12px;left:18px;font-size:13px;box-shadow:var(--shadow)}
.pin.hl .dot,.pin:hover .dot{transform:scale(1.5);box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 7px var(--c),0 4px 10px rgba(0,0,0,.4)}
.pin.hl{animation:bounce .6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.pin .dot{transition:transform .15s,box-shadow .15s}
@media (prefers-reduced-motion:reduce){.pin.hl{animation:none}}
.row.hl{background:var(--hover);box-shadow:inset 3px 0 0 var(--c)}

.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.phead{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.meta button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:1px 8px;font-family:var(--sans);font-size:12px}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 7px;text-align:left;display:grid;opacity:.5;transition:opacity .15s}
.chip[aria-pressed="true"]{opacity:1;border-color:var(--c);background:var(--cbg)}
.chip b{font-family:var(--mono);font-size:20px;line-height:1.2;color:var(--c)}
.chip span{font-size:11px;line-height:1.3}
.tools input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.notice{font-size:12px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--week-bg)}
.notice.err{background:#FBE9E6;color:#C0392B}
.pbody{overflow:auto;flex:1;min-height:0}
.group h2{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.08em;margin:0;padding:12px 16px 4px;position:sticky;top:0;background:var(--panel);z-index:1}
.row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 10px;padding:9px 16px 9px 12px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:hover{background:var(--hover)}
.row .stripe{grid-row:1/3;border-radius:2px;background:var(--c)}
.row .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .loc{font-size:12px;color:var(--muted);white-space:nowrap}
.row .sub{grid-column:2/4;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub.issue{color:var(--issue)}
.dbadge{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--c);color:#fff}
.empty{padding:24px 16px;color:var(--muted);font-size:13px}

.detail{padding:16px;display:grid;gap:14px}
.back{border:0;background:none;color:var(--accent);padding:0;justify-self:start;font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--cbg);color:var(--c);border:1px solid var(--c)}
.detail h3{font-size:20px;margin:4px 0 0}
.kv{display:grid;grid-template-columns:5em 1fr;gap:6px 10px;margin:0}
.kv dt{color:var(--muted);font-size:12px;padding-top:2px}
.kv dd{margin:0;word-break:break-word}
.issuebox{background:var(--issue-bg);border:1px solid var(--issue);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.note{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.mono{font-family:var(--mono);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.leaflet-container{font-family:var(--sans)}
.fitbtn.g{top:auto;bottom:120px}
/* ---------- 排路線 ---------- */
.tools{display:flex;gap:8px}
.tools input{flex:1;min-width:0}
.routebtn{border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:8px;padding:7px 12px;white-space:nowrap;font-weight:500}
.routebtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.routebox{margin:12px 16px;border:1.5px solid var(--accent);border-radius:10px;padding:12px;display:grid;gap:10px;background:#F4FAF8}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rhead b{font-size:15px}
.rhead span{font-size:12px;color:var(--muted)}
.fromme{display:flex;align-items:center;gap:6px;font-size:13px}
.stops{list-style:none;margin:0;padding:0;display:grid;gap:0}
.stops li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.stops li:first-child{border-top:0}
.stops .n{grid-row:1/3;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--mono);font-size:12px;display:grid;place-items:center}
.stops .n.me{background:#1F63E0}
.stops .nm2{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stops .leg{grid-column:2/3;font-size:12px;color:var(--muted);font-family:var(--mono)}
.stops .ops{grid-row:1/3;grid-column:3;display:flex;gap:4px}
.stops .ops button{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:28px;height:28px;font-size:13px;line-height:1}
.rtotal{font-size:13px;background:var(--panel);border-radius:8px;padding:8px 10px;border:1px solid var(--line)}
.rtotal b{font-family:var(--mono);font-size:15px}
.rempty{font-size:13px;color:var(--muted)}
.ractions{display:flex;flex-wrap:wrap;gap:6px}
.ractions .btn{padding:7px 12px;font-size:13px}
.row.instop{background:#F4FAF8}
.row .stopno{font-family:var(--mono);font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px}
.pin .num{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;z-index:2}
.pin.stop .lbl.hide{display:block}
.mepin{position:relative;width:0;height:0}
.mepin i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:#1F63E0;border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,99,224,.25)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:2000;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
body.routing #map .leaflet-interactive{cursor:pointer}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto;min-height:100%}
  #v-map{overflow:auto}
  .brand{display:none}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .pbody{overflow:visible}
  .legend{font-size:11px;padding:6px 10px;bottom:20px}
}

/* ---------- 今日排班 ---------- */
.page{max-width:1100px;margin:0 auto;padding-block:16px 40px;padding-inline:16px;display:grid;gap:14px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.pagehead h2{margin:0;font-size:22px}
.pagehead h2 small{font-size:14px;color:var(--muted);font-weight:500;margin-left:8px}
.rest{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.rest span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.rest b{font-weight:500;color:var(--muted);margin-right:6px}
.crews{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.crew{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid}
.crew .ch{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:2px;background:#F7F9F6}
.crew .site{font-size:17px;font-weight:700;line-height:1.35}
.crew .th{font-size:13px;color:var(--muted)}
.crew .cb{padding:12px 14px;display:grid;gap:10px}
.kvrow{display:grid;grid-template-columns:4.5em 1fr;gap:6px;align-items:start;font-size:14px}
.kvrow>span:first-child{color:var(--muted);font-size:12px;padding-top:3px}
.ppl{display:flex;flex-wrap:wrap;gap:5px}
.ppl i{font-style:normal;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:13px}
.ppl i.lead{background:var(--accent);color:#fff;border-color:var(--accent)}
.car{font-family:var(--mono);font-size:13px;background:#FFF4DB;border:1px solid #F2C46D;border-radius:6px;padding:1px 8px}
.tasks{display:flex;flex-wrap:wrap;gap:6px}
.task{border:1px solid var(--line);border-radius:8px;padding:3px 9px;display:grid;line-height:1.3}
.task b{font-weight:500;font-size:13px}
.task small{color:var(--muted);font-size:12px}
.crew .note{background:#FFF8E6;border-radius:8px;padding:6px 10px;font-size:13px}
.crew .cf{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.crew .cf .btn{padding:6px 12px;font-size:13px}
.nomatch{font-size:12px;color:var(--muted)}
.need{display:flex;flex-wrap:wrap;gap:5px}
.need i{font-style:normal;font-size:12px;border-radius:6px;padding:1px 7px;background:#E5F4E8;color:#1E6B34}
.need i.low{background:#FEF3C7;color:#8A5A00}
.need i.out{background:#FDE2E2;color:#B42318}
/* ---------- 庫存 ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;text-align:left}
.tile b{font-family:var(--mono);font-size:26px;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.tile.out b{color:#B42318}.tile.low b{color:#B7791F}.tile.need b{color:#1E6B34}
button.tile[aria-pressed="true"]{outline:2px solid var(--accent)}
.sbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 14px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.sbar input{flex:1;min-width:160px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px}
.stbl{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,.7fr)) minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.srow.h{border-top:0;background:#F7F9F6;font-size:12px;color:var(--muted);font-weight:500}
.srow .nm b{font-weight:500}
.srow .nm small{display:block;color:var(--muted);font-size:12px}
.srow .num{font-family:var(--mono);text-align:right}
.srow .num.neg{color:#B42318;font-weight:700}
.srow .tot{font-weight:700}
.st{justify-self:start;font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.out{background:#FDE2E2;color:#B42318}.st.low{background:#FEF3C7;color:#8A5A00}.st.ok{background:#E5F4E8;color:#1E6B34}.st.idle{background:#EEF0EF;color:#63706F}
.tag2{font-size:11px;background:#FFF4DB;border:1px solid #F2C46D;border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.foot{font-size:12px;color:var(--muted)}
.errbox{background:#FDE2E2;color:#B42318;border-radius:10px;padding:12px 14px;font-size:13px}
@media (max-width:760px){
  .srow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .srow.h{display:none}
  .srow .nm{grid-column:1/3}
  .srow .num::before{content:attr(data-l);color:var(--muted);font-family:var(--sans);font-size:11px;margin-right:4px}
  .srow .num{text-align:left}
  .srow>*:nth-child(n+2){font-size:13px}
  .crews{grid-template-columns:1fr}
}

/* ---------- 網站填寫 ---------- */
.loginbtn{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:999px;padding:5px 14px;font-size:13px;white-space:nowrap}
.loginbtn.on{background:#fff;color:var(--accent);font-weight:500}
.mini{border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:6px;padding:3px 10px;font-size:12px}
.modal-bg{position:fixed;inset:0;background:rgba(20,28,30,.45);z-index:3000;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);display:grid}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.modal header h3{margin:0;font-size:17px}
.modal header button{border:0;background:none;font-size:20px;line-height:1;padding:4px 8px}
.modal .mb{padding:16px 18px;display:grid;gap:12px}
.modal .mf{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line)}
.fld{display:grid;gap:4px}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;font:inherit}
.fld textarea{min-height:80px;resize:vertical}
.fld .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.segs{display:flex;flex-wrap:wrap;gap:6px}

/* 地圖符號：跟著縮放變大變小（看全台小一點，放大後大一點） */
#map{--ps:24px}
.pin .dot{left:calc(var(--ps)/-2);top:calc(var(--ps)/-2);width:var(--ps);height:var(--ps);border-width:2.5px;font-size:calc(var(--ps)*.55);box-shadow:0 1px 5px rgba(0,0,0,.4)}
.pin.sel .dot{left:calc(var(--ps)*-.62);top:calc(var(--ps)*-.62);width:calc(var(--ps)*1.24);height:calc(var(--ps)*1.24);border-width:3.5px}
.pin .halo{left:calc(var(--ps)/-2);top:calc(var(--ps)/-2);width:var(--ps);height:var(--ps);border-width:2px}
.pin .dot.star{left:calc(var(--ps)*-.62);top:calc(var(--ps)*-.62);width:calc(var(--ps)*1.24);height:calc(var(--ps)*1.24);font-size:calc(var(--ps)*.8);border-width:3px}
.pin .num{left:calc(var(--ps)*-.55);top:calc(var(--ps)*-.55);width:calc(var(--ps)*1.1);height:calc(var(--ps)*1.1);font-size:calc(var(--ps)*.5);border-width:2.5px}
.pin .tag{bottom:calc(var(--ps)*.6);font-size:11px;line-height:16px}
.pin .lbl{left:calc(var(--ps)*.65);top:-9px;font-size:13px}
.pin.hl .lbl,.pin:hover .lbl{left:calc(var(--ps)*.8);top:-12px;font-size:14px}
.pin.hl .dot,.pin:hover .dot{transform:scale(1.3);box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 0 6px var(--c),0 4px 10px rgba(0,0,0,.4)}
.pin.hl .dot.star,.pin:hover .dot.star{transform:scale(1.3)}
.pin .today{left:calc(var(--ps)*.6);top:calc(var(--ps)*-1.1)}
@keyframes pulse3{from{transform:scale(1);opacity:.7}to{transform:scale(2);opacity:0}}
.pin .halo{animation-name:pulse3}
.mepin i{left:-12px;top:-12px;width:24px;height:24px;border-width:3.5px;box-shadow:0 0 0 7px rgba(31,99,224,.25)}

.wkc.me{background:#FFE066}
.wrest td{color:var(--muted);font-size:12px}
/* 編輯：檢查、建議 */
.edwarn{background:#FDECEA;color:#9B1C1C;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:13px}

.edsugg .sg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.edsugg .sg>span{color:var(--muted);min-width:70px}
.edsugg button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.edsugg button i{width:8px;height:8px;border-radius:50%;background:var(--c)}.edsugg button:hover{border-color:#1F63E0;background:#E6F0FF}

/* 報價單 */
.qf{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);border:1px solid var(--line);margin:6px 0;background:#fff}

.qf b,.qpick b{display:block;font-size:14px;font-weight:600;word-break:break-all}.qf small,.qpick small{display:block;color:var(--muted);font-size:12px}
.qi{font-size:18px;line-height:1.2}
.qlist{max-height:55vh;overflow:auto;display:grid;gap:4px}
.qpick{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.qpick:has(input:checked){border-color:#1F63E0;background:#F3F7FF}

.sitechips .qbtn{font-size:12px!important;color:#1F4FB0!important;padding:0 1px!important}
.board .qlink{border:0;background:none;font:inherit;font-weight:inherit;color:#1F4FB0;cursor:pointer;padding:0;text-align:center}
.board .qlink i{font-style:normal;font-size:11px;opacity:.6}.board .qlink:hover{text-decoration:underline}.board .qlink:hover i{opacity:1}

/* 範圍選取／一次清除 */
.board.edit td.sel{background:#CFE0FF!important;box-shadow:inset 0 0 0 1px #1F63E0}
.board.edit td.thsite[data-grp]{cursor:pointer}.board.edit td.thsite[data-grp]:hover{background:#E6F0FF}
.board.edit .gcell{user-select:none}
.clrbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.clrmenu{position:relative}.clrmenu summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:#fff;font-weight:600}
.clrmenu summary::-webkit-details-marker{display:none}
.clrpop{position:absolute;z-index:50;top:110%;left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:10px;display:grid;gap:6px;width:220px}
.clrpop button,.selbar button{border:1px solid var(--line);background:#F7F9F6;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;text-align:left}
.clrpop button:hover,.selbar button:hover{border-color:#1F63E0;background:#E6F0FF}
.clrpop .danger,.selbar .danger{color:#B42318;border-color:#F3C1BC;background:#FDECEA}
.selhint{font-size:12px;color:var(--muted)}
.selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:900;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#1E1E1E;color:#fff;border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 24px)}
.selbar[hidden]{display:none}
.selbar button{background:#fff;color:#1E1E1E;padding:4px 10px}

/* 編輯排班：左側近期需進場 */
.edlayout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.edmain{min-width:0}
.edside{position:sticky;top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 24px);overflow:hidden}
.eshead{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:6px}.eshead b{font-size:15px}
.eshead input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
.eslist{overflow:auto;padding:6px 8px 10px}
.esg{margin-top:8px}.esd{font-size:13px;font-weight:700;color:#B42318;padding:4px 2px;border-bottom:2px solid #F3C1BC;margin-bottom:4px;display:flex;justify-content:space-between;cursor:default}
.esd span{font-weight:400;color:var(--muted);font-size:12px}
.esg:not(.late) .esd{color:#1F5C55;border-color:#CFE3DD}
details.esg summary{list-style:none;cursor:pointer}
.sidecard{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:6px 8px;margin:5px 0;cursor:grab;background:#fff;font-size:13px}
.sidecard:hover{border-color:#1F63E0;background:#F3F7FF}
.sidecard.used{opacity:.55}
.sidecard .scn{display:flex;align-items:center;gap:6px}.sidecard .scn i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.sidecard .scn b{flex:1;font-weight:700}.sidecard .scn button{border:0;background:none;cursor:pointer;font-size:13px;padding:0}
.sidecard small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.sidecard em{display:block;font-style:normal;font-size:11px;color:#8A6D00;margin-top:2px}.sidecard em.ok{color:#2E9E44}
.esfoot{padding:8px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.dragging-site .board.edit td.site{outline:2px dashed #9DB8F0;outline-offset:-3px}
.board.edit td.dropok{background:#CFE0FF!important}
@media (max-width:1100px){.edlayout{grid-template-columns:1fr}.edside{position:static;max-height:320px}}

/* 編輯排班：小的「＋」、同案場按鈕在左欄 */
.board.edit .gcell.gsite.more{min-height:20px;width:auto;display:inline-block;padding:0 10px;font-size:12px;line-height:18px;margin-top:3px}
.board.edit td.thsite .dupbtn{display:block;width:auto;margin:6px auto 0;font-size:11px;padding:2px 8px}
/* 施工紀錄 */
.hppl{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0 8px;font-size:12px}.hppl>span{color:var(--muted);margin-right:4px}
.hppl i{font-style:normal;background:#F2F4F1;border:1px solid var(--line);border-radius:12px;padding:1px 8px}.hppl i b{color:#1F5C55}
.hlist{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
.hrow .hd{border:0;background:none;padding:0;text-align:left;font:inherit;font-weight:700;color:#1F4FB0;cursor:pointer;text-decoration:underline}
.hrow .hd small{display:block;font-weight:400;color:var(--muted);text-decoration:none}
.hrow .hcar{font-size:11px;background:#FFF1B8;border-radius:4px;padding:0 4px}
.hrow .ht{color:#555;font-size:12px}.hrow .hn{color:#B42318;font-size:12px}

/* 編輯排班：緊湊版（跟原本試算表差不多大小）；操作按鈕滑過才出現 */
.board.edit td{height:22px}
.board.edit .gcell{min-height:22px;padding:1px 4px;line-height:1.25}
.board.edit td.lead .gcell{font-size:17px}
.board.edit td.wk .gcell{font-size:13px;min-width:52px}
.board.edit td.tk .gcell{font-size:14px;min-width:96px}
.board.edit tr.th td.tk{padding:1px 4px;font-size:13px}
.board.edit td.thsite{padding:2px 6px;font-size:13px;min-width:150px}
.board.edit td.site{padding:2px 6px;min-width:140px}
.sitechips{gap:0}.sitechips span{font-size:15px;line-height:1.3}
.sitechips span button{display:none}
.board.edit td.site:hover .sitechips span button{display:inline}
.board.edit .gcell.gsite.more{position:absolute;top:2px;right:2px;margin:0;padding:0 6px;min-height:16px;line-height:16px;font-size:12px;display:none;background:#fff}
.board.edit td.site:hover .gcell.gsite.more,.board.edit .gcell.gsite.more.act{display:block}
.board.edit .gcell.gsite:not(.more){min-height:24px;margin:0}
.board.edit td.thsite .rowops{position:absolute;left:4px;bottom:3px;margin:0;display:none;opacity:1}
.board.edit td.thsite .dupbtn{position:absolute;right:4px;bottom:3px;margin:0;display:none;font-size:11px;padding:1px 6px;width:auto}
.board.edit td.thsite:hover .rowops,.board.edit td.thsite:hover .dupbtn{display:flex}
.board.edit td.note{padding:0}.board.edit .gnote{min-height:46px;height:100%;padding:2px 4px;font-size:13px;color:#C0201B;font-weight:700;font-style:italic;text-align:center}
.board.edit td.cnt{padding:0 4px}

/* 編輯排班：再壓縮，一頁看完約 17 組 */
#v-today .page{padding-top:8px}
.board.edit td{height:18px}
.board.edit th,.board.edit td{padding:0 3px}
.board.edit .gcell{min-height:18px;padding:0 3px;font-size:13px;line-height:18px}
.board.edit td.lead .gcell{font-size:15px}
.board.edit td.wk .gcell{font-size:12px;min-width:44px}
.board.edit td.tk .gcell{font-size:13px;min-width:80px}
.board.edit tr.th td.tk{font-size:12px;line-height:1.15}
.board.edit td.thsite{font-size:12px;line-height:1.2;min-width:130px}
.board.edit td.site{min-width:120px}
.sitechips span{font-size:14px;line-height:1.2}
.board.edit td.car .gcell{font-size:12px;min-width:64px}
.board.edit td.note{min-width:110px}.board.edit .gnote{min-height:36px;font-size:12px;line-height:1.2}
.board.edit .dt{font-size:15px;padding:1px 4px}
.board.edit .ttl{font-size:20px}
.board.edit td.rest,.board.edit td.restv{font-size:12px}
.board.edit tr:first-child td,.board.edit tr:nth-child(2) td{height:20px}
.freebox{padding:4px 10px;font-size:12px}
.edwarn{padding:4px 10px;margin-top:4px;font-size:12px}
.clrbar{margin:4px 0}.selhint{font-size:11px}
.edside{max-height:calc(100vh - 16px)}

/* 手機版排班編輯 */
.mhead{position:sticky;top:0;z-index:20;background:var(--bg,#F4F4F2);padding:6px 0 8px;display:grid;gap:6px}
.mtop{display:flex;align-items:center;gap:8px}.mtop b{font-size:18px;flex:1}
.mhead .daytabs{display:flex}.mhead .daytabs button{flex:1}
.mtools{display:flex;gap:6px;align-items:center}.mtools .btn{padding:6px 10px;font-size:13px}
.mtools .clrmenu summary{padding:6px 10px;font-size:13px}.mtools .clrpop{left:auto;right:0}
.mfree{font-size:12px;color:var(--muted);background:#F4FAF8;border-radius:10px;padding:6px 10px}.mfree b{color:var(--ink)}
.mbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px}
.mbox summary{font-weight:700;cursor:pointer}.mbox summary small{font-weight:400;color:var(--muted)}
.mbox .eslist{max-height:280px;overflow:auto;padding:0}
.mcards{display:grid;gap:8px;margin-top:10px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mcard.empty{opacity:.75}
.mcard.open{border-color:#1F5C55;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.mch{width:100%;display:flex;align-items:center;gap:10px;border:0;background:#E0FBEB;padding:10px 12px;text-align:left;font:inherit;cursor:pointer}
.mcard:nth-child(even) .mch{background:#fff}
.mno{width:26px;height:26px;border-radius:50%;background:#1F5C55;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.mcs{flex:1;min-width:0}.mcs b{display:block;color:#1F4FB0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mcs small{color:#555;font-size:13px}
.mch i{font-style:normal;color:var(--muted);font-size:12px}
.mcb{padding:10px 12px;display:grid;gap:10px}
.mrow>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.mrow>span b{color:#1F5C55}
.mrow.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mrow.two span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mchips em{font-style:normal;font-weight:700;color:#1F4FB0;background:#EEF3FF;border-radius:16px;padding:4px 4px 4px 10px;display:inline-flex;align-items:center;gap:2px}
.mchips em button{border:0;background:none;color:#9AA6A4;font-size:16px;padding:0 6px;cursor:pointer}
.mthai{font-size:13px;color:#555;margin-top:-6px}
.mgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mcb .gcell,.mbox .gcell{border:1px solid var(--line);background:#FAFBFA;border-radius:10px;min-height:42px;padding:6px 4px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;width:100%;color:var(--ink)}
.mcb .gcell.empty i,.mbox .gcell.empty i{font-style:normal;color:#C5CCCA;font-weight:400}
.mcb .gcell.act,.mbox .gcell.act{border-color:#1F63E0;background:#E6F0FF}
.mbox .mchips .gcell{width:auto;min-width:64px}
.mcb .gcell.madd{width:auto;border-style:dashed;color:#1F5C55;font-weight:600;padding:6px 12px}
.mcb .mgrid4 .gcell{font-style:italic;font-size:14px}
.mnote{width:100%;border:1px solid var(--line)!important;border-radius:10px;min-height:44px;font-size:14px;color:#C0201B}
.mops{display:flex;flex-wrap:wrap;gap:6px}.mops .btn{padding:6px 10px;font-size:13px}

.ocrlist{display:grid;gap:6px;max-height:50vh;overflow:auto;margin:8px 0}.ocrlist>div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px}
.ocrlist small{display:block;color:#555;font-size:12px;margin-top:2px}.ocrlist i{color:#B42318;font-style:normal}

.lrow.acc{grid-template-columns:1fr 1fr 70px auto auto}.accon{display:flex;align-items:center;gap:3px;font-size:12px;white-space:nowrap}
.edothers{background:#FDECEA;color:#9B1C1C;border:1px solid #F3C1BC;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;margin-bottom:6px}

.board td.navc{border:0;background:transparent!important;padding:0 6px 0 0;width:52px}
.board td.navh{font-size:11px;color:var(--muted);vertical-align:bottom}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;background:#1F5C55;color:#fff;border-radius:10px;padding:5px 4px;font-size:18px;line-height:1}
.navbtn small{font-size:10px;font-weight:600}.navbtn:hover{background:#174a44}

/* 月曆 */
.mcal{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mcalbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.mcalbar b{font-size:18px}
.mlegend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:auto;flex-wrap:wrap}
.mlegend i{width:12px;height:12px;border-radius:3px;display:inline-block}.mlegend i.ev{background:#12A37A}.mlegend i.pl{background:#fff;border:2px solid #1F63E0}.mlegend em{font-style:normal;margin-left:8px}
.mcal .mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
.mwd{text-align:center;font-size:13px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
.mday{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 3px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mday:nth-child(7n+7){border-right:0}
.mday.other{background:#FAFAF8}.mday.other .mdh b{color:#B8BDBB}
.mday.sel{box-shadow:inset 0 0 0 2px #1F5C55}.mday.drop{background:#E6F0FF}
.mdh{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:2px 0;font:inherit;width:100%}
.mdh b{font-size:15px;font-weight:600}.mdh b.sun{color:#D93025}.mdh b.sat{color:#1F63E0}.mdh small{font-size:11px;color:var(--muted)}
.mday.today .mdh b{background:#1F5C55;color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.mev,.mpl{border:0;border-radius:4px;padding:2px 5px;font:inherit;font-size:12px;font-weight:700;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.mev{background:#12A37A;color:#fff}.mev small{font-weight:400;opacity:.85;margin-left:4px}
.mpl{background:#fff;color:#1F63E0;border:1.5px solid #1F63E0}.mpl[draggable=true],.mev[draggable=true]{cursor:grab}
@media (max-width:760px){.mday{min-height:84px;padding:1px}.mev,.mpl{font-size:10px;padding:1px 3px}.mev small{display:none}.mlegend em{display:none}}

/* 月曆：雙擊預定進場 */
.mday.pick{background:#E8F5EF;box-shadow:inset 0 0 0 2px #12A37A}
.mday{cursor:default;user-select:none}
.mplan{position:fixed;top:64px;right:16px;bottom:16px;width:360px;background:var(--panel,#fff);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.22);z-index:60;display:flex;flex-direction:column;gap:10px;padding:12px}
.mph{display:flex;align-items:center;gap:10px}.mph b{font-size:17px;flex:1}.mph .x{border:0;background:none;font-size:20px;cursor:pointer;padding:4px 8px}
.mpname{font:inherit;font-size:20px;font-weight:700;padding:12px;border:2px solid #12A37A;border-radius:10px;width:100%;box-sizing:border-box}
.mpdate{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}.mpdate input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.mplist{overflow:auto;display:flex;flex-direction:column;gap:4px;flex:1}
.mpcap{font-size:12px;color:var(--muted);padding:4px 2px}
.mpi{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px}
.mpi:hover{border-color:#12A37A}.mpi.on{background:#E8F5EF;border-color:#12A37A}.mpi small{color:var(--muted);font-size:12px}
.mpi.new{border-style:dashed;color:#1F63E0}
@media (min-width:761px){body.planning .page{margin-right:390px}}
@media (max-width:420px){.tab{padding:14px 7px 11px;font-size:13px}.tab .cnt{margin-left:3px}}

/* 登入畫面 */

body.gated>*:not(.gate):not(script){visibility:hidden}
.gbox{background:#fff;border-radius:16px;padding:28px 22px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}

.gbox .btn{font-size:17px;padding:12px}.gerr{color:#D93025;font-size:14px;min-height:1em;text-align:center}
.gfoot{font-size:12px;color:var(--muted);text-align:center}

/* ================= 深色科技風（整站） ================= */
:root{
  --bg:#15202B; --panel:#1C2A38; --panel2:#223344; --ink:#E8EFF4; --muted:#93A6B5; --line:rgba(160,190,215,.2); --hover:rgba(45,226,180,.08);
  --accent:#2DE2B4; --accent2:#3BA7FF; --accent-ink:#03140F;
  --issue:#FF5470; --active:#34D399; --week:#4C9AFF; --later:#8DB6FF; --done:#5F7080;
  --issue-bg:rgba(255,84,112,.12); --active-bg:rgba(52,211,153,.12); --week-bg:rgba(76,154,255,.13); --later-bg:rgba(141,182,255,.10); --done-bg:rgba(95,112,128,.14);
  --shadow:0 10px 30px rgba(0,0,0,.3);
  --glow:0 0 0 1px rgba(45,226,180,.35),0 0 22px rgba(45,226,180,.18);
  --amber:#F5B841; --amber-bg:rgba(245,184,65,.12); --red:#FF6B81; --red-bg:rgba(255,84,112,.12);
  color-scheme:dark;
}
body{background:
  radial-gradient(1200px 600px at 85% -10%,rgba(59,167,255,.10),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(45,226,180,.08),transparent 60%),
  linear-gradient(rgba(160,190,215,.045) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,rgba(160,190,215,.045) 1px,transparent 1px) 0 0/32px 32px,
  var(--bg);background-attachment:fixed}
::selection{background:rgba(45,226,180,.35)}
*{scrollbar-color:rgba(140,175,200,.25) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(140,175,200,.22);border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

/* 頂欄 */
.topbar{background:linear-gradient(180deg,rgba(28,42,56,.92),rgba(21,32,43,.88));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:relative;z-index:10}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent2) 70%,transparent);opacity:.7}
.brand{display:flex;align-items:center;gap:9px;letter-spacing:.12em;font-weight:700}
.brand::before{content:"";width:16px;height:16px;transform:rotate(45deg);border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 14px rgba(45,226,180,.7);flex:none}
.tab{color:rgba(227,236,241,.6);position:relative;border-bottom-color:transparent!important;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--accent)}
.tab .cnt{background:rgba(45,226,180,.14);color:var(--accent)}
.tab .cnt.bad{background:rgba(255,84,112,.2);color:#FF8FA3}
.loginbtn{background:rgba(255,255,255,.04)!important;color:var(--ink)!important;border:1px solid var(--line)!important}
.loginbtn.on{color:var(--accent)!important;border-color:rgba(45,226,180,.4)!important;box-shadow:0 0 14px rgba(45,226,180,.15)}

/* 按鈕、輸入 */
.btn{background:rgba(255,255,255,.03);border-color:var(--line);color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s}
.btn:hover{border-color:rgba(45,226,180,.5);background:rgba(45,226,180,.06)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#22C3E6);color:var(--accent-ink);border-color:transparent;font-weight:700;box-shadow:0 0 18px rgba(45,226,180,.28)}
.btn.primary:hover{box-shadow:0 0 26px rgba(45,226,180,.45);filter:brightness(1.05)}
.btn:disabled{opacity:.45;box-shadow:none}
input,select,textarea{color:var(--ink)}
.fld input,.fld select,.fld textarea,.tools input,.sbar input,.lrow input,.lrow select,.wkt input,.mesel select,.mpdate input,.mpname,.gbox input{background:rgba(255,255,255,.035)!important;border-color:var(--line)!important;color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus,.tools input:focus,.sbar input:focus,.mpname:focus,.gbox input:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(45,226,180,.15)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
select option{background:#1C2A38;color:var(--ink)}
.seg,.segs button,.daytabs{background:rgba(255,255,255,.03)!important;border-color:var(--line)!important}
.seg button{color:var(--muted)}
.seg button[aria-pressed="true"],.segs button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),#22C3E6)!important;color:var(--accent-ink)!important;font-weight:700}
.daytabs button{background:transparent!important;color:var(--ink)}
.daytabs button[aria-pressed="true"],.daytabs button.on{background:linear-gradient(135deg,var(--accent),#22C3E6)!important;color:var(--accent-ink)!important}

/* 卡片／面板：玻璃質感 */
.panel{background:rgba(28,42,56,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.group h2{background:rgba(28,42,56,.95);color:var(--accent);letter-spacing:.14em;font-family:var(--mono);font-size:11px;text-transform:uppercase}
.chip{background:rgba(255,255,255,.02)}
.chip[aria-pressed="true"]{box-shadow:0 0 16px -4px var(--c)}
.chip b{text-shadow:0 0 12px var(--c)}
.crew,.tile,.mcard,.mbox,.edside,.mcal,.qf,.sidecard,.mpi,.modal,.legend,.fitbtn{background:linear-gradient(180deg,rgba(34,51,68,.9),rgba(28,42,56,.9))!important;border-color:var(--line)!important}
.crew:hover,.tile:hover{border-color:rgba(45,226,180,.35)!important}
.tile b{font-family:var(--mono)}
.crew .ch,.srow.h,.wkt th,.mch,.mcard:nth-child(even) .mch{background:rgba(45,226,180,.05)!important}
.crew .note,.ainote,.dupbox,.mebar,.hrow .hcar,.wkt input.ai{background:var(--amber-bg)!important;border-color:rgba(245,184,65,.35)!important;color:var(--ink)}
.dupnote{background:var(--amber-bg)!important;color:var(--amber)!important;border:1px solid rgba(245,184,65,.35)!important}
.mebar.rest,.mebar.none{background:rgba(255,255,255,.04)!important;border-color:var(--line)!important}
.mebar .mesite,.mcs b,.hrow .hd{color:#7DB8FF!important}
.mebar .mekv{color:var(--ink)!important}
.car:not(td),.tag2{background:var(--amber-bg)!important;border-color:rgba(245,184,65,.4)!important;color:var(--amber)!important}
.need i{background:rgba(52,211,153,.12)!important;color:#5EEAB0!important}
.need i.low,.st.low{background:var(--amber-bg)!important;color:var(--amber)!important}
.need i.out,.st.out,.errbox,.merr,.edwarn,.edothers,.notice.err{background:var(--red-bg)!important;color:#FF8FA3!important;border-color:rgba(255,84,112,.35)!important}
.st.ok,.rep .rk.done{background:rgba(52,211,153,.12)!important;color:#5EEAB0!important}
.st.idle{background:rgba(255,255,255,.05)!important;color:var(--muted)!important}
.tile.need b{color:#5EEAB0}.tile.low b{color:var(--amber)}.tile.out b,.srow .num.neg,.hist .q.neg{color:#FF8FA3}
.rep .rk.issue{background:rgba(255,84,112,.2)!important;color:#FF8FA3!important;border-color:transparent!important}
.routebox,.aibox,.freebox,.edsugg,.mfree,.row.instop{background:rgba(45,226,180,.06)!important}
.edsugg summary,.esg:not(.late) .esd,.mrow>span b,.hppl i b,.editor .saved,.savest.ok,.sidecard em.ok{color:var(--accent)!important}
.edsugg button,.rowops button,.clrmenu summary,.clrpop,.clrpop button,.selbar button,.pickbar button,.hppl i,.mchips em,.mcb .gcell,.mbox .gcell{background:rgba(255,255,255,.04)!important;border-color:var(--line)!important;color:var(--ink)!important}
.clrpop{background:#1F2E3D!important;box-shadow:var(--shadow)}
.clrpop .danger,.selbar .danger{color:#FF8FA3!important;border-color:rgba(255,84,112,.35)!important;background:var(--red-bg)!important}
.edsugg button:hover,.clrpop button:hover,.selbar button:hover,.sidecard:hover,.qf:hover,.qpick:has(input:checked),.mcb .gcell.act,.mbox .gcell.act{border-color:var(--accent2)!important;background:rgba(59,167,255,.1)!important}
.mchips em{color:#7DB8FF!important}
.esd{color:#FF8FA3;border-bottom-color:rgba(255,84,112,.3)}
.sidecard em{color:var(--amber)}
.notice{background:rgba(76,154,255,.08);color:var(--ink)}
.toast{background:rgba(28,42,56,.95);color:var(--ink);border:1px solid rgba(45,226,180,.4);box-shadow:var(--glow);backdrop-filter:blur(10px)}
.modal-bg{background:rgba(2,5,8,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal{box-shadow:var(--glow),0 30px 80px rgba(0,0,0,.6)!important}
.modal header,.modal .mf{background:#1F2E3D!important}
.modal header h3,.modal header b{letter-spacing:.04em}
.pagehead h2{letter-spacing:.06em}
.pagehead h2::before{content:"";display:inline-block;width:4px;height:.9em;margin-right:10px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent2));box-shadow:0 0 10px var(--accent);vertical-align:-2px}

/* 地圖 */
#map{background:#15202B}
.leaflet-bar a,.leaflet-bar a:hover{background:#1F2E3D!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:rgba(21,32,43,.7)!important;color:var(--muted)!important}.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1F2E3D;color:var(--ink)}
.pin .lbl{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 6px #000}
.pin.hl .lbl,.pin:hover .lbl{background:rgba(21,32,43,.92);color:#fff;border:1px solid rgba(45,226,180,.5)}
.pin .dot{box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 12px var(--c)}
.legend{backdrop-filter:blur(10px)}
.issuebox{color:var(--ink)}
.note{background:rgba(255,255,255,.03)}

/* 排班卡片（手機） */
.mch{color:var(--ink)}

/* 編輯側欄、選單 */
#gpop{background:#1F2E3D!important;border-color:rgba(45,226,180,.35)!important;box-shadow:var(--glow),0 20px 50px rgba(0,0,0,.6)!important;color:var(--ink)}
#gpop .gpb button{background:rgba(255,255,255,.04)!important;border-color:var(--line)!important;color:var(--ink)!important}
#gpop .gpb button:hover{background:rgba(59,167,255,.12)!important;border-color:var(--accent2)!important}
#gpop .gpb button em{background:var(--amber-bg)!important;color:var(--amber)!important}
#gpop .gpclr{background:transparent!important;color:#FF8FA3!important}
#gpop input{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--ink)}

/* 月曆 */
.mcalbar b{letter-spacing:.06em}
.mwd{color:var(--accent);font-family:var(--mono);letter-spacing:.2em}
.mday{border-color:var(--line)!important;transition:background .15s}
.mday:hover{background:rgba(45,226,180,.035)}
.mday.other{background:rgba(0,0,0,.14)!important}.mday.other .mdh b{color:#56697B!important}
.mday.today .mdh b{background:linear-gradient(135deg,var(--accent),var(--accent2))!important;color:var(--accent-ink)!important;box-shadow:0 0 14px rgba(45,226,180,.6)}
.mday.sel{box-shadow:inset 0 0 0 1.5px rgba(45,226,180,.7)!important}
.mday.drop,.mday.pick{background:rgba(59,167,255,.12)!important;box-shadow:inset 0 0 0 2px var(--accent2)!important}
.mdh b.sat{color:#6FB1FF}.mdh b.sun{color:#FF7A8E}
.mev{background:linear-gradient(90deg,rgba(45,226,180,.9),rgba(34,195,230,.85))!important;color:#03140F!important;box-shadow:0 0 10px -2px rgba(45,226,180,.6)}
.mev small{color:#03302A}
.mpl{background:rgba(76,154,255,.08)!important;color:#8DC2FF!important;border:1px solid rgba(76,154,255,.6)!important}
.mlegend i.ev{background:var(--accent)!important}.mlegend i.pl{background:transparent!important;border-color:#4C9AFF!important}
.mplan{background:rgba(28,42,56,.96)!important;border-color:rgba(45,226,180,.35)!important;box-shadow:var(--glow),0 20px 60px rgba(0,0,0,.6)!important;backdrop-filter:blur(14px)}
.mpi.on{background:rgba(45,226,180,.1)!important;border-color:var(--accent)!important}
.mpi.new{color:#8DC2FF}
.mpname{border:2px solid rgba(45,226,180,.6)!important}

/* 登入畫面 */
.gate{background:radial-gradient(800px 500px at 50% 0%,rgba(45,226,180,.16),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(59,167,255,.14),transparent 60%),
  linear-gradient(rgba(140,175,200,.05) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(140,175,200,.05) 1px,transparent 1px) 0 0/32px 32px,#111B25}
.gbox{background:rgba(28,42,56,.85)!important;border:1px solid rgba(45,226,180,.3);box-shadow:var(--glow),0 30px 80px rgba(0,0,0,.7)!important;backdrop-filter:blur(16px)}
.glogo{color:#fff!important;letter-spacing:.16em;display:flex;align-items:center;justify-content:center;gap:12px}
.glogo::before{content:"";width:18px;height:18px;transform:rotate(45deg);border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 18px rgba(45,226,180,.8)}
.gsub{font-family:var(--mono);letter-spacing:.1em}

/* 「紙本」區：排班總表、週表、庫存表維持白底（存圖、列印、師傅看得清楚） */
.boardwrap,.board,.sheet,.wkview{--bg:#F3F4F1;--panel:#FFFFFF;--ink:#1E2A2C;--muted:#63706F;--line:#DCE0DA;--hover:#EEF2EB;--accent:#1F5C55;--accent-ink:#FFFFFF;--issue:#1E1E1E;color:var(--ink);color-scheme:light}
.boardwrap{background:#fff!important;border:1px solid rgba(45,226,180,.4)!important;box-shadow:0 0 0 1px rgba(45,226,180,.12),0 0 30px rgba(45,226,180,.10),0 16px 40px rgba(0,0,0,.5)}
.boardwrap .btn{background:#fff;color:#1E2A2C;border-color:#DCE0DA}
.boardwrap .btn.primary{background:#1F5C55;color:#fff;box-shadow:none}
.boardwrap input,.boardwrap select{color:#1E2A2C}
.foot{color:var(--muted)}
@media (max-width:420px){.brand{font-size:0;gap:0;letter-spacing:0}.topbar{gap:8px}}

/* 手機：整頁不亂縮，表格自己縮放 */
@media (pointer:coarse){html,body{touch-action:pan-x pan-y}}
.zbar{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin:0 0 6px;font-size:12px;color:var(--muted)}
.zbar span{margin-right:auto}
.zbar button{min-width:38px;height:34px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);border-radius:8px;font:inherit;font-size:15px;font-weight:700}
.zbar button[data-z=fit]{font-size:13px;padding:0 10px;color:var(--accent);border-color:rgba(45,226,180,.4)}
.zbar b{min-width:44px;text-align:center;font-family:var(--mono);color:var(--ink)}
.boardwrap{-webkit-overflow-scrolling:touch}
@media (pointer:coarse) and (max-height:500px){.tab{padding:8px 10px 7px}.brand{padding:6px 0}.page{padding-block:8px 24px;gap:8px}.pagehead h2{font-size:18px}.zbar span{display:none}.zbar{margin:0}.zbar button{height:30px}}

/* 排班編輯：拖曳換順序 */
.board.edit td.thsite{position:relative}
.board.edit td.thsite .grip{position:absolute;left:2px;top:50%;transform:translateY(-50%);width:18px;height:34px;display:none;align-items:center;justify-content:center;border-radius:5px;background:#1F5C55;color:#fff;font-size:14px;line-height:1;cursor:grab;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.board.edit td.thsite:hover .grip{display:flex}
.board.edit td.thsite .grip:active{cursor:grabbing}
.board.edit tr.rowdrag>td{opacity:.35}
.board.edit tr.dropbefore>td{box-shadow:inset 0 3px 0 #1F63E0}
.board.edit tr.dropafter>td{box-shadow:inset 0 -3px 0 #1F63E0}

.board.edit td.site{cursor:pointer;user-select:none;-webkit-user-select:none}
.board.edit td.site:hover{background:#E6F0FF}

/* 排班編輯：＋案場移到泰文格；案場後面 ✕ 可刪 */
.board.edit .gcell.gsite.more{display:none!important}
.board.edit td.thsite .addsite{position:absolute;right:3px;top:3px;display:none;border:1px solid #1F63E0;background:#fff;color:#1F63E0;border-radius:6px;font:inherit;font-size:11px;font-weight:700;padding:1px 6px;cursor:pointer;z-index:2}
.board.edit td.thsite:hover .addsite{display:block}
.board.edit td.thsite .addsite:hover{background:#1F63E0;color:#fff}
.board.edit .sitechips span button[data-e=rmsite]{display:inline-flex!important;align-items:center;justify-content:center;width:18px;height:18px;margin-left:3px;border-radius:50%;color:#D93025!important;font-size:11px;font-weight:700;background:#FDECEA!important;opacity:.55}
.board.edit td.site:hover .sitechips span button[data-e=rmsite]{opacity:1}
.board.edit .sitechips span button[data-e=rmsite]:hover{background:#D93025!important;color:#fff!important}

/* 總表：導航下面的複製連結 */
.navpair{display:flex;gap:4px;align-items:stretch;width:100px}.navpair small{white-space:nowrap}.navpair .navbtn{flex:1}
.navc:has(.navpair){width:100px}
.navcopy{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:1;margin:0;border:1px solid #1F5C55;background:#fff;color:#1F5C55;border-radius:10px;padding:4px 4px;font-size:15px;line-height:1;cursor:pointer;font-family:inherit}
.navcopy small{font-size:10px;font-weight:600}
.navcopy:hover{background:#E8F5EF}

/* 照片：背景上傳進度、相簿 */
.upbar{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:3500;width:min(340px,calc(100% - 32px));background:rgba(28,42,56,.96);color:var(--ink);border:1px solid rgba(45,226,180,.45);border-radius:12px;padding:10px 12px;box-shadow:var(--glow);display:grid;gap:6px;font-size:13px;overflow:hidden}
.upbar i{display:block;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.upbar small{color:var(--muted)}
.previews .more{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:8px;border:1px dashed var(--line);font-size:13px;color:var(--muted);vertical-align:top}
.reports h4{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reports h4 .btn{font-size:12px;padding:4px 10px}
.album{display:grid;gap:14px}
.albh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.albt{font-size:13px;color:var(--muted);margin-bottom:6px}.albt span{display:block;color:var(--ink);margin-top:2px}
.albgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.albgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:rgba(255,255,255,.05)}

/* ================= 萬聖節主題（右上角 🎃 可以切換） ================= */
/* ================= 深色科技風（整站） ================= */
html.hw{
  --bg:#140C1C; --panel:#1E1329; --panel2:#261833; --ink:#F6EEE3; --muted:#B19FC2; --line:rgba(200,160,255,.17); --hover:rgba(255,138,31,.08);
  --accent:#FF8A1F; --accent2:#B26BFF; --accent-ink:#1F0D00;
  --issue:#FF5470; --active:#34D399; --week:#4C9AFF; --later:#8DB6FF; --done:#5F7080;
  --issue-bg:rgba(255,84,112,.12); --active-bg:rgba(52,211,153,.12); --week-bg:rgba(76,154,255,.13); --later-bg:rgba(141,182,255,.10); --done-bg:rgba(95,112,128,.14);
  --shadow:0 10px 30px rgba(0,0,0,.3);
  --glow:0 0 0 1px rgba(255,138,31,.35),0 0 22px rgba(255,138,31,.18);
  --amber:#F5B841; --amber-bg:rgba(245,184,65,.12); --red:#FF6B81; --red-bg:rgba(255,84,112,.12);
  color-scheme:dark;
}
html.hw body{background:
  radial-gradient(1200px 600px at 85% -10%,rgba(178,107,255,.10),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(255,138,31,.08),transparent 60%),
  linear-gradient(rgba(178,107,255,.05) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,rgba(178,107,255,.05) 1px,transparent 1px) 0 0/32px 32px,
  var(--bg);background-attachment:fixed}
html.hw ::selection{background:rgba(255,138,31,.35)}
html.hw *{scrollbar-color:rgba(140,175,200,.25) transparent}
html.hw ::-webkit-scrollbar{width:10px;height:10px}html.hw ::-webkit-scrollbar-thumb{background:rgba(140,175,200,.22);border-radius:10px;border:2px solid transparent;background-clip:padding-box}html.hw ::-webkit-scrollbar-track{background:transparent}

/* 頂欄 */
html.hw .topbar{background:linear-gradient(180deg,rgba(30,19,41,.92),rgba(20,12,28,.88));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:relative;z-index:10}
html.hw .topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent2) 70%,transparent);opacity:.7}
html.hw .brand{display:flex;align-items:center;gap:9px;letter-spacing:.12em;font-weight:700}
html.hw .brand::before{content:"";width:16px;height:16px;transform:rotate(45deg);border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 14px rgba(255,138,31,.7);flex:none}
html.hw .tab{color:rgba(227,236,241,.6);position:relative;border-bottom-color:transparent!important;transition:color .15s}
html.hw .tab:hover{color:var(--ink)}
html.hw .tab[aria-selected="true"]{color:#fff}
html.hw .tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--accent)}
html.hw .tab .cnt{background:rgba(255,138,31,.14);color:var(--accent)}

    <div id="map"></div>
    <button class="fitbtn" id="fit" title="顯示全部案場" aria-label="顯示全部案場">⤢</button>
    <div class="legend">
      <span><i style="background:var(--issue)"></i>問題單</span>
      <span><i style="background:var(--active)"></i>進場中</span>
      <span><i style="background:var(--week)"></i>7 天內進場</span>
      <span><i style="background:var(--later)"></i>待安排</span>
      <span><i style="background:var(--done)"></i>已完工</span>
      <span><b class="lstar">★</b>今日出車</span>
    </div>
  </div>
  <aside class="panel">
    <div class="phead">
      <div class="titlerow"><h1>富林組合屋 案場地圖</h1>
        <span class="meta"><span id="updated">載入中…</span><button id="reload">重新整理</button></span></div>
      <div class="chips" id="chips"></div>
      <div class="tools"><input id="q" type="search" placeholder="搜尋案名、地址、負責人"><button class="routebtn" id="routeBtn" aria-pressed="false">排路線</button><button class="routebtn" id="addSiteBtn" hidden>＋ 新增</button></div>
    </div>
    <div class="notice" id="notice" hidden></div>
    <div class="pbody" id="pbody"></div>
  </aside>
</div>
</main>
<main class="view" id="v-today" hidden><div class="page" id="todayPage"><div class="foot">載入排班中…</div></div></main>
<main class="view" id="v-stock" hidden><div class="page" id="stockPage"><div class="foot">載入庫存中…</div></div></main>
<main class="view" id="v-manage" hidden><div class="page" id="managePage"></div></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
const CFG=window.FULIN_CONFIG;
let todayBySite={},sched=null,stock=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BUCKETS=[
  {k:'issue',label:'問題單',c:'--issue',bg:'--issue-bg'},
  {k:'active',label:'進場中',c:'--active',bg:'--active-bg'},
  {k:'week',label:'7 天內進場',c:'--week',bg:'--week-bg'},
  {k:'later',label:'待安排',c:'--later',bg:'--later-bg'},
  {k:'done',label:'已完工',c:'--done',bg:'--done-bg'}
];
const BK=Object.fromEntries(BUCKETS.map(b=>[b.k,b]));

// ---------- parsing ----------
function parseStatus(v){v=String(v||'');
  if(/問題|異常|客訴|維修/.test(v))return 'issue';
  if(/完工|結案|完成/.test(v))return 'done';
  if(/進場中|施工/.test(v))return 'active';
  if(/預定|進場|待/.test(v))return 'upcoming';
  return 'active'}
function pad(n){return String(n).padStart(2,'0')}
function parseDate(cell){if(!cell)return '';const v=cell.v;
  if(typeof v==='string'){let m=v.match(/^Date\((\d+),(\d+),(\d+)/);if(m)return m[1]+'-'+pad(+m[2]+1)+'-'+pad(m[3]);
    m=v.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
    m=v.match(/^(\d{1,2})\D(\d{1,2})$/);if(m)return new Date().getFullYear()+'-'+pad(m[1])+'-'+pad(m[2])}
  if(cell.f){const m=cell.f.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3])}
  return ''}
function parseCoord(v){v=String(v||'');let m=v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||v.match(/(-?\d{1,3}\.\d+)\s*[,，\s]\s*(-?\d{1,3}\.\d+)/);
  if(!m)return null;let a=+m[1],b=+m[2];if(a>90)[a,b]=[b,a];if(a<20||a>27||b<117||b>123)return null;return [a,b]}
function cellText(c){if(!c)return '';if(c.f!=null&&typeof c.v!=='string')return String(c.f);return c.v==null?'':String(c.v)}

const COLS={name:['案名','名稱','案場'],status:['狀態'],startDate:['進場日','進場日期','預定進場'],address:['地址'],coord:['座標','位置','經緯度'],
  owner:['負責人'],contact:['聯絡人'],phone:['電話','聯絡電話'],issue:['問題描述','問題','備註']};
function rowsFromTable(t){
  const labels=t.cols.map(c=>String(c.label||'').trim());
  const idx={};for(const k in COLS){idx[k]=labels.findIndex(l=>COLS[k].some(n=>l===n||l.startsWith(n)))}
  const out=[];
  t.rows.forEach((r,i)=>{const c=r.c||[];const g=k=>idx[k]>=0?c[idx[k]]:null;
    const name=cellText(g('name')).trim();if(!name)return;
    const co=parseCoord(cellText(g('coord')));
    out.push({id:'r'+i,coordText:cellText(g('coord')).trim(),name,status:parseStatus(cellText(g('status'))),startDate:parseDate(g('startDate')),
      address:cellText(g('address')).trim(),lat:co?co[0]:null,lng:co?co[1]:null,
      owner:cellText(g('owner')).trim(),contact:cellText(g('contact')).trim(),phone:cellText(g('phone')).trim(),issue:cellText(g('issue')).trim()})});
  return out}

function daysUntil(ds){if(!ds)return null;const [y,m,d]=ds.split('-').map(Number);const t=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/864e5)}
function bucket(s){if(s.status==='upcoming'){const n=daysUntil(s.startDate);return (n!==null&&n<=7)?'week':'later'}return s.status}
function dLabel(n){if(n===null)return '';if(n===0)return '今天';if(n<0)return '逾'+(-n)+'天';return 'D-'+n}

// ---------- state ----------
let sites=[],selected=null,loaded=false;
let filters=new Set(['issue','active','week','later']);
try{const f=JSON.parse(localStorage.getItem('fulin-map-filters')||'null');if(Array.isArray(f))filters=new Set(f)}catch(e){}

// ---------- map ----------
// 有 GOOGLE_MAPS_KEY 就用 Google 地圖；沒有或金鑰失效則自動改用備用底圖（Esri）。
const CENTER={lat:23.1,lng:120.6};
let M=null; // 地圖轉接層：setView / fit / zoom / clear / add
function leafletAdapter(){
  const el=$('map');el.innerHTML='';
  const map=L.map(el,{zoomControl:true}).setView([CENTER.lat,CENTER.lng],8);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'}).addTo(map);
  map.zoomControl.setPosition('topright');
  const layer=L.layerGroup().addTo(map);
  const rlayer=L.layerGroup().addTo(map);
  map.on('zoomend',drawPins);
  map.on('click',e=>{if(window.__pickCb)window.__pickCb(e.latlng.lat,e.latlng.lng)});
  return {kind:'osm',
    resize:()=>map.invalidateSize(),
    setView:(lat,lng,z)=>map.setView([lat,lng],z),
    zoom:()=>map.getZoom(),
    fit:pts=>map.fitBounds(pts,{padding:[40,40],maxZoom:14}),
    clear:()=>layer.clearLayers(),
    line:(pts,me)=>{rlayer.clearLayers();
      if(pts.length>1){L.polyline(pts,{color:'#FFFFFF',weight:7,opacity:.9}).addTo(rlayer);L.polyline(pts,{color:'#1F5C55',weight:4,dashArray:'8 8'}).addTo(rlayer)}
      if(me)L.marker(me,{icon:L.divIcon({html:'<div class="mepin"><i></i></div>',className:'',iconSize:[0,0]}),zIndexOffset:-100,title:'目前位置'}).addTo(rlayer)},
    add:(lat,lng,html,z,title,onClick)=>{const m=L.marker([lat,lng],{icon:L.divIcon({html,className:'',iconSize:[0,0]}),title,zIndexOffset:z});m.on('click',onClick);m.addTo(layer);return {front:on=>m.setZIndexOffset(on?100000:z)}}};
}
async function googleAdapter(){
  const {Map,OverlayView}=await google.maps.importLibrary('maps');
  const {ControlPosition,LatLngBounds}=await google.maps.importLibrary('core');
  const map=new Map($('map'),{center:CENTER,zoom:8,gestureHandling:'greedy',clickableIcons:false,
    mapTypeControl:true,mapTypeControlOptions:{position:ControlPosition.TOP_LEFT},streetViewControl:false,fullscreenControl:false,
    zoomControlOptions:{position:ControlPosition.RIGHT_TOP}});
  map.addListener('click',e=>{if(window.__pickCb)window.__pickCb(e.latLng.lat(),e.latLng.lng())});
  class HtmlMarker extends OverlayView{
    constructor(lat,lng,html,z,title,onClick){super();this.pos={lat,lng};const d=document.createElement('div');
      d.style.cssText='position:absolute;cursor:pointer;z-index:'+z;d.title=title;d.innerHTML=html;
      d.addEventListener('click',e=>{e.stopPropagation();onClick()});this.div=d;OverlayView.preventMapHitsAndGesturesFrom(d)}
    onAdd(){this.getPanes().overlayMouseTarget.appendChild(this.div)}
    draw(){const p=this.getProjection().fromLatLngToDivPixel(this.pos);if(p){this.div.style.left=p.x+'px';this.div.style.top=p.y+'px'}}
    onRemove(){this.div.remove()}}
  $('fit').classList.add('g');
  let markers=[],lastZ=map.getZoom(),poly=[],meM=null;
  map.addListener('zoom_changed',()=>{const z=map.getZoom();if((z>=13)!==(lastZ>=13))drawPins();lastZ=z});
  return {kind:'google',
    resize:()=>{},
    setView:(lat,lng,z)=>{map.setCenter({lat,lng});map.setZoom(z)},
    zoom:()=>map.getZoom(),
    fit:pts=>{const b=new LatLngBounds();pts.forEach(p=>b.extend({lat:p[0],lng:p[1]}));map.fitBounds(b,40);
      google.maps.event.addListenerOnce(map,'idle',()=>{if(map.getZoom()>14)map.setZoom(14)})},
    clear:()=>{markers.forEach(m=>m.setMap(null));markers=[]},
    line:(pts,me)=>{poly.forEach(p=>p.setMap(null));poly=[];if(meM){meM.setMap(null);meM=null}
      const path=pts.map(p=>({lat:p[0],lng:p[1]}));
      if(pts.length>1){poly.push(new google.maps.Polyline({path,map,strokeColor:'#1F5C55',strokeWeight:4,strokeOpacity:0,icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:1,scale:3},offset:'0',repeat:'14px'}]}))}
      if(me){meM=new HtmlMarker(me[0],me[1],'<div class="mepin"><i></i></div>',1,'目前位置',()=>{});meM.setMap(map)}},
    add:(lat,lng,html,z,title,onClick)=>{const m=new HtmlMarker(lat,lng,html,z,title,onClick);m.setMap(map);markers.push(m);return {front:on=>{m.div.style.zIndex=on?100000:z}}}};
}
function useOSM(reason){$('fit').classList.remove('g');M=leafletAdapter();if(reason){const n=$('notice');n.className='notice err';n.textContent=reason;n.hidden=false}render();if(loaded)fitAll()}
function initMap(){
  const key=(CFG.GOOGLE_MAPS_KEY||'').trim();
  if(!key)return useOSM();
  window.gm_authFailure=()=>useOSM('Google 地圖金鑰無法使用（可能尚未啟用 Maps JavaScript API、未綁帳單，或網址限制設定錯誤），已暫時改用備用底圖。');
  window.__gmReady=()=>googleAdapter().then(a=>{M=a;render();if(loaded)fitAll()}).catch(()=>useOSM('Google 地圖載入失敗，已暫時改用備用底圖。'));
  const sc=document.createElement('script');
  sc.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&callback=__gmReady&loading=async&language=zh-TW&region=TW';
  sc.async=true;sc.onerror=()=>useOSM('連不到 Google 地圖，已暫時改用備用底圖。');
  document.head.appendChild(sc);
}
function matchQ(s,q){return [s.name,s.address,s.owner,s.contact,s.issue].some(v=>String(v||'').toLowerCase().includes(q))}
function visible(){const q=$('q').value.trim().toLowerCase();return sites.filter(s=>filters.has(bucket(s))&&(!q||matchQ(s,q)))}
function drawPins(){if(!M)return;const z=M.zoom();$('map').style.setProperty('--ps',(z<=8?20:z<=10?24:z<=12?30:36)+'px');M.clear();for(const k in pinHandles)delete pinHandles[k];const order={done:0,later:1,active:2,week:3,issue:4};const showLbl=M.zoom()>=13;
  const vis=visible();const inRoute=new Set(route);
  sites.forEach(s=>{if(inRoute.has(s.id)&&!vis.includes(s))vis.push(s)});
  vis.filter(s=>s.lat!=null).sort((a,b)=>order[bucket(a)]-order[bucket(b)]).forEach(s=>{
    const b=bucket(s);const sel=selected===s.id;const no=route.indexOf(s.id)+1;
    let h='<div class="pin'+(sel?' sel':'')+(no?' stop':'')+(hoverId===s.id?' hl':'')+'" data-id="'+s.id+'" style="--c:var('+BK[b].c+')">';
    if(b==='issue'&&!no)h+='<div class="halo"></div>';
    const tcx=todayBySite[s.id];
    h+=no?'<div class="num">'+no+'</div>':(tcx?'<div class="dot star">★</div>':'<div class="dot">'+(b==='issue'?'!':'')+'</div>');
    if(b==='week')h+='<div class="tag">'+esc(dLabel(daysUntil(s.startDate)))+'</div>';

    h+='<div class="lbl'+(showLbl||sel?'':' hide')+'">'+(tcx?'★ 今日 '+esc(tcx.leader||'出車')+'｜':'')+esc(s.name)+'</div>';
    h+='</div>';
    const hnd=M.add(s.lat,s.lng,h,order[b]*100+(sel?1000:0)+(no?5000:0)+(todayBySite[s.id]?3000:0),s.name,()=>routeMode?toggleStop(s.id):openDetail(s.id,false));
    if(hnd){pinHandles[s.id]=hnd;if(hoverId===s.id)hnd.front(true)}});
  drawRouteLine()}
function fitAll(){if(!M)return;const pts=visible().filter(s=>s.lat!=null).map(s=>[s.lat,s.lng]);
  if(!pts.length)return M.setView(CENTER.lat,CENTER.lng,8);
  if(pts.length===1)return M.setView(pts[0][0],pts[0][1],14);
  M.fit(pts)}
$('fit').onclick=fitAll;

// ---------- panel ----------
function renderChips(){const c={issue:0,active:0,week:0,later:0,done:0};sites.forEach(s=>c[bucket(s)]++);
  $('chips').innerHTML=BUCKETS.map(b=>'<button class="chip" data-k="'+b.k+'" aria-pressed="'+filters.has(b.k)+'" style="--c:var('+b.c+');--cbg:var('+b.bg+')"><b>'+c[b.k]+'</b><span>'+b.label+'</span></button>').join('')}
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const k=b.dataset.k;
  filters.has(k)?filters.delete(k):filters.add(k);try{localStorage.setItem('fulin-map-filters',JSON.stringify([...filters]))}catch(e){}render()});
$('q').addEventListener('input',render);

function renderList(){const q=$('q').value.trim().toLowerCase();const html=[];let any=false;
  for(const b of BUCKETS){if(!filters.has(b.k))continue;
    const items=sites.filter(s=>bucket(s)===b.k&&(!q||matchQ(s,q)));
    // 7 天內進場依日期；其他分類由北到南（緯度高到低），沒座標的排最後
    if(b.k==='week')items.sort((a,c)=>String(a.startDate||'9').localeCompare(String(c.startDate||'9')));
    else items.sort((a,c)=>(c.lat??-99)-(a.lat??-99));
    if(!items.length)continue;any=true;
    html.push('<div class="group"><h2>'+b.label+' · '+items.length+'</h2>');
    for(const s of items){let sub,right='';
      if(b.k==='issue')sub='<div class="sub issue">'+esc(s.issue||'（未填問題描述）')+'</div>';
      else if(b.k==='week'||b.k==='later'){right='<span class="dbadge" style="--c:var('+b.c+')">'+esc(dLabel(daysUntil(s.startDate))||'日期未定')+'</span>';sub='<div class="sub">'+esc((s.startDate||'進場日未定')+(s.owner?' · '+s.owner:''))+'</div>'}
      else sub='<div class="sub">'+esc([s.owner,s.address].filter(Boolean).join(' · '))+'</div>';
      if(s.lat==null)right+=' <span class="loc">未定位</span>';
      const no=route.indexOf(s.id)+1;if(routeMode&&no)right='<span class="stopno">第 '+no+' 站</span>';
      html.push('<button class="row'+(routeMode&&no?' instop':'')+'" data-id="'+s.id+'" style="--c:var('+b.c+')"><span class="stripe"></span><span class="nm">'+(todayBySite[s.id]?'<span class="star" title="今日出車">★</span>':'')+esc(s.name)+'</span><span class="loc">'+right+'</span>'+sub+'</button>')}
    html.push('</div>')}
  if(!any)html.push('<div class="empty">'+(loaded?(sites.length?'沒有符合篩選條件的案場。點上方的分類可以切換顯示。':'試算表裡還沒有案場資料。'):'載入中…')+'</div>');
  $('pbody').innerHTML=(routeMode?routeHtml():'')+html.join('')}
function navUrl(s){return s.lat!=null?'https://www.google.com/maps/search/?api=1&query='+s.lat+','+s.lng:(s.address?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address):'')}
function renderDetail(){const s=sites.find(x=>x.id===selected);if(!s){selected=null;return renderList()}
  const b=BK[bucket(s)];const rows=[];
  if(s.startDate)rows.push(['進場日','<span class="mono">'+esc(s.startDate)+'</span>'+(s.status==='upcoming'?'　'+esc(dLabel(daysUntil(s.startDate))):'')]);
  rows.push(['泰文',s.thai?esc(s.thai):'<span style="color:var(--muted)">還沒翻譯（會自動補）</span>']);
  rows.push(['地址',esc(s.address||'—')],['負責人',esc(s.owner||'—')],['聯絡人',esc(s.contact||'—')]);
  rows.push(['電話',s.phone?'<a class="mono" href="tel:'+esc(s.phone.replace(/[^\d+]/g,''))+'">'+esc(s.phone)+'</a>':'—']);
  if(s.lat==null)rows.push(['座標','尚未填寫，地圖上不會顯示']);
  const nav=navUrl(s);
  $('pbody').innerHTML='<div class="detail"><button class="back" data-act="back">← 返回列表</button>'+
    '<div><span class="pill" style="--c:var('+b.c+');--cbg:var('+b.bg+')">'+b.label+'</span><h3>'+esc(s.name)+'</h3></div>'+
    (s.issue?'<div><div class="mono" style="color:var(--muted);margin-bottom:4px">'+(s.status==='issue'?'問題描述':'備註')+'</div><div class="'+(s.status==='issue'?'issuebox':'note')+'">'+esc(s.issue)+'</div></div>':'')+
    '<dl class="kv">'+rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('')+'</dl>'+
    (nav?'<div class="actions"><a class="btn primary" href="'+nav+'" target="_blank" rel="noopener">Google 地圖導航</a></div>':'')+
    (canField()?adminDetailHtml(s):'')+(isAdmin()?'<div class="adminbox" id="quoteBox"><h4>報價單</h4><div class="foot">讀取中…</div></div>':'')+(canField()?'<div class="adminbox" id="histBox"><h4>施工紀錄</h4><div class="foot">讀取中…</div></div>':'')+reportsHtml(s)+'</div>';
  if(isAdmin())fillQuotes(s);if(canField())fillHist(s)}
// ---------- 滑鼠連動：列表 ↔ 地圖標記 ----------
let hoverId=null;const pinHandles={};
function setHover(id){
  if(hoverId===id)return;
  if(hoverId){document.querySelectorAll('.pin[data-id="'+hoverId+'"],.row[data-id="'+hoverId+'"]').forEach(el=>el.classList.remove('hl'));
    if(pinHandles[hoverId])pinHandles[hoverId].front(false)}
  hoverId=id;
  if(id){document.querySelectorAll('.pin[data-id="'+id+'"],.row[data-id="'+id+'"]').forEach(el=>el.classList.add('hl'));
    if(pinHandles[id])pinHandles[id].front(true)}
}
$('pbody').addEventListener('mouseover',e=>{const r=e.target.closest('.row');setHover(r?r.dataset.id:null)});
$('pbody').addEventListener('mouseleave',()=>setHover(null));
$('map').addEventListener('mouseover',e=>{const p=e.target.closest&&e.target.closest('.pin[data-id]');if(p)setHover(p.dataset.id)});
$('map').addEventListener('mouseout',e=>{const p=e.target.closest&&e.target.closest('.pin[data-id]');if(p&&!(e.relatedTarget&&p.contains(e.relatedTarget)))setHover(null)});
$('pbody').addEventListener('click',e=>{
  const a=e.target.closest('[data-r]');if(a)return routeAction(a.dataset.r,a.dataset.id);
  const r=e.target.closest('.row');if(r)return routeMode?toggleStop(r.dataset.id):openDetail(r.dataset.id,true);
  if(e.target.closest('[data-act="back"]')){selected=null;render()}});
function openDetail(id,fly){selected=id;const s=sites.find(x=>x.id===id);render();
  if(fly&&s&&s.lat!=null&&M)M.setView(s.lat,s.lng,Math.max(M.zoom(),14));
  if(!fly&&window.matchMedia('(max-width:760px)').matches)$('pbody').scrollIntoView({behavior:'smooth'})}
function render(){renderChips();(selected&&!routeMode)?renderDetail():renderList();drawPins()}

// ---------- 排路線：連線、估算路程、分享 ----------
let routeMode=false,route=[],fromMe=false,myPos=null;
try{fromMe=localStorage.getItem('fulin-route-fromme')==='1'}catch(e){}
const siteKey=s=>s.name+'@'+(s.lat!=null?s.lat.toFixed(4)+','+s.lng.toFixed(4):'');
function saveRoute(){try{localStorage.setItem('fulin-route',JSON.stringify(route.map(id=>siteKey(sites.find(x=>x.id===id))).filter(Boolean)));localStorage.setItem('fulin-route-fromme',fromMe?'1':'0')}catch(e){}}
function restoreRoute(){try{const keys=JSON.parse(localStorage.getItem('fulin-route')||'[]');const used=new Set();
  route=keys.map(k=>{const s=sites.find(x=>siteKey(x)===k&&!used.has(x.id));if(s){used.add(s.id);return s.id}}).filter(Boolean)}catch(e){}}
function toggleStop(id){const s=sites.find(x=>x.id===id);if(!s)return;
  if(s.lat==null){toast('這個案場沒有座標，無法加入路線');return}
  const i=route.indexOf(id);i>=0?route.splice(i,1):route.push(id);saveRoute();render()}
function km(a,b){const R=6371,r=Math.PI/180,dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;

// 路程估算：直線距離 × 1.35（道路繞行係數），平均時速 50 公里

// Google 地圖網址一次最多帶 9 個中途點，超過就分段
function gmapsLinks(){const st=stopPts();if(!st.length)return[];const P=s=>s.lat.toFixed(6)+','+s.lng.toFixed(6);
  const pts=st.map(P);const useMe=fromMe;const out=[];let i=0;
  while(i<pts.length){const first=i===0;const origin=first?(useMe?null:pts[0]):pts[i-1];
    const startIdx=first&&!useMe?1:i;const seg=pts.slice(startIdx,startIdx+10);if(!seg.length)break;
    const dest=seg[seg.length-1],wps=seg.slice(0,-1);
    let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(dest);
    if(origin)u+='&origin='+encodeURIComponent(origin);if(wps.length)u+='&waypoints='+encodeURIComponent(wps.join('|'));

function optimize(){let st=stopPts();if(st.length<3&&!(fromMe&&myPos))return;
  const start=(fromMe&&myPos)?myPos:[st[0].lat,st[0].lng];let rest=(fromMe&&myPos)?st.slice():st.slice(1);const ord=(fromMe&&myPos)?[]:[st[0]];
  let cur=start;while(rest.length){let bi=0,bd=1e9;rest.forEach((s,i)=>{const d=km(cur,[s.lat,s.lng]);if(d<bd){bd=d;bi=i}});const n=rest.splice(bi,1)[0];ord.push(n);cur=[n.lat,n.lng]}
  // 2-opt 微調
  const pt=s=>[s.lat,s.lng];const fixed=(fromMe&&myPos)?0:1;let improved=true,guard=0;
  const D=(a,b)=>km(a,b);
  while(improved&&guard++<50){improved=false;
    for(let i=fixed;i<ord.length-1;i++)for(let j=i+1;j<ord.length;j++){
      const a=i===0?start:pt(ord[i-1]),b=pt(ord[i]),c=pt(ord[j]),d=j+1<ord.length?pt(ord[j+1]):null;
      const before=D(a,b)+(d?D(c,d):0),after=D(a,c)+(d?D(b,d):0);

  route=ord.map(s=>s.id);saveRoute();render();toast('已排成最順的順序')}

    if(s.address)lines.push('   地址：'+s.address);

  lines.push('','總路程約 '+tk.toFixed(0)+' 公里，車程約 '+fmtMin(tm)+'（估計）');
  gmapsLinks().forEach((u,i,arr)=>lines.push('Google 導航'+(arr.length>1?'（第 '+(i+1)+' 段）':'')+'：'+u));
  return lines.join('\n')}

const UP_BATCH=4;let upQ=[],upBusy=false,upDone=0,upTotal=0,upFail=0;
function queueUpload(s,reportId,files,start,total){upQ.push({s,reportId,files,start});upTotal+=files.length;upBar();if(!upBusy)runUpload()}
function upBar(){let b=$('upbar');if(!upBusy&&!upQ.length&&upDone>=upTotal){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='upbar';b.className='upbar';document.body.appendChild(b)}
  const p=upTotal?Math.round(upDone/upTotal*100):0;b.innerHTML='<b>📷 照片上傳中 '+upDone+' / '+upTotal+'</b><i style="width:'+p+'%"></i><small>'+(upFail?upFail+' 張失敗，稍後再補 · ':'')+'請不要關掉這個網頁</small>'}
async function runUpload(){upBusy=true;
  while(upQ.length){const job=upQ[0];
    while(job.files.length){const part=job.files.splice(0,UP_BATCH);const photos=[];for(const f of part){try{photos.push(await shrink(f))}catch(e){upFail++}}
      let ok=false;for(let t=0;t<3&&!ok;t++){try{await api('photo_add',{reportId:job.reportId,photos,start:job.start});ok=true}catch(e){await new Promise(r=>setTimeout(r,3000*(t+1)))}}
      if(!ok)upFail+=photos.length;job.start+=part.length;upDone+=part.length;upBar()}
    upQ.shift()}
  upBusy=false;const f=upFail,t=upTotal;upDone=upTotal=upFail=0;upBar();toast(f?'照片上傳完成，但有 '+f+' 張沒傳成功':'照片全部上傳完成（'+t+' 張）');load()}
window.addEventListener('beforeunload',e=>{if(upBusy){e.preventDefault();e.returnValue='照片還在上傳中'}});
