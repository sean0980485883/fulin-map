function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
  const max=1600,k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res({type:'image/jpeg',data:cv.toDataURL('image/jpeg',.8).split(',')[1]})};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function copySync(text){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;width:2px;height:2px;padding:0;border:0;opacity:.01;font-size:16px;z-index:-1';

function copyLink(u){if(!u)return;if(copySync(u)){toast('已複製出車資料，可以貼到 LINE');return}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(u).then(()=>toast('已複製出車資料，可以貼到 LINE')).catch(()=>copyBox(u));return}
  copyBox(u)}
function copyBox(u){openModal('出車資料','<div class="fld"><label>長按下面文字 →「全選」→「拷貝」，或直接按「分享到 LINE」</label><textarea id="cpTxt" readonly style="min-height:200px;font-size:16px">'+esc(u)+'</textarea></div>',

    if(act==='share'){try{await navigator.share({text:u})}catch(e){}return false}
    if(act==='copy'){const t=$('cpTxt');t.removeAttribute('readonly');t.focus();t.select();t.setSelectionRange(0,u.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.setAttribute('readonly','');toast(ok?'已複製':'請長按文字選「拷貝」');return !ok}

function schedFromImage(){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;toast('AI 讀取排班圖片中…（約 30～60 秒）');
    try{const img=await shrink2(f,2000);
      const lists={people:DB.people.map(p=>p.name),cars:DB.cars,tasks:DB.tasks.map(t=>t.zh),sites:sites.filter(x=>x.status!=='done').map(x=>x.name).slice(0,300)};
      const d=(await api('sched_ocr',{image:img,lists})).data||{};applyOcr(d)}
    catch(err){const m=/未知的動作/.test(err.message)?'後台還沒更新：請把新版 富林系統.gs 貼回 Apps Script 並部署新版本。':err.message;openModal('從圖片匯入失敗','<div class="foot" style="color:#B42318;font-size:15px">'+esc(m)+'</div><div class="foot">可以截圖這個訊息給我。</div>',[['關閉','close','primary']],async()=>true)}};
  inp.click()}
// 把 AI 讀到的名字對到名單裡的正式寫法（大小寫、空白、只寫英文名都對得上）
function matchName(v,list){v=String(v||'').trim();if(!v)return '';const k=norm(v).toLowerCase();
  return list.find(x=>norm(x).toLowerCase()===k)||list.find(x=>{const y=norm(x).toLowerCase();return y.includes(k)||k.includes(y)})||v}
function matchCar(v){v=String(v||'').trim();if(!v)return '';const dg=v.replace(/\D/g,'');return (dg.length>=3&&DB.cars.find(c=>c.replace(/\D/g,'')===dg))||matchName(v,DB.cars)}
function matchSite(v){v=String(v||'').trim();if(!v)return '';const k=norm(v);const s=sites.find(x=>norm(x.name)===k)||sites.find(x=>coreName(x.name).length>=2&&k.includes(coreName(x.name)));return s?s.name:v}
function applyOcr(d){const P=DB.people.map(p=>p.name),TK=DB.tasks.map(t=>t.zh);
  const crews=(d.crews||[]).map(c=>{const ss=(c.sites||[]).map(matchSite).filter(Boolean);const ids=ss.map(n=>(sites.find(x=>x.name===n)||{}).id).filter(Boolean);
    return toCrew({site:ss.join('\n'),siteIds:ids,leader:matchName(c.leader,P),car:matchCar(c.car),workers:(c.workers||[]).map(w=>matchName(w,P)).filter(Boolean).slice(0,8),tasks:(c.tasks||[]).map(t=>matchName(t,TK)).filter(Boolean).slice(0,5),note:String(c.note||'')})})
    .filter(c=>c.site||c.leader||c.car||c.workers.some(Boolean));
  if(!crews.length){toast('AI 沒有讀到排班內容，請確認圖片清楚、是整張排班表');return}
  const nW=crews.reduce((a,c)=>a+c.workers.filter(Boolean).length,0);
  const unknown=[...new Set(crews.flatMap(c=>[c.leader].concat(c.workers)).filter(n=>n&&!P.includes(n)))];
  openModal('從圖片匯入排班','<div class="foot">AI 讀到 <b>'+crews.length+' 組</b>、<b>'+nW+' 位工人</b>'+(d.date?'（圖片日期 '+esc(d.date)+'）':'')+'。</div>'+
    '<div class="ocrlist">'+crews.map((c,i)=>'<div><b>'+(i+1)+'. '+esc(crewSites(c).join('、')||'（沒有案場）')+'</b><small>'+esc([c.leader,c.car,c.workers.filter(Boolean).join('、')].filter(Boolean).join('｜'))+(c.tasks.some(Boolean)?'<br>'+esc(c.tasks.filter(Boolean).join('、')):'')+(c.note?'<br><i>'+esc(c.note)+'</i>':'')+'</small></div>').join('')+'</div>'+
    (unknown.length?'<div class="foot" style="color:#B42318">名單裡沒有的名字：'+esc(unknown.join('、'))+'（會照原樣填入，可以之後再改）</div>':'')+
    '<div class="foot">要填進「'+esc(mdw(draft.date))+'」嗎？會取代這一天目前的內容，填錯可以按「↶ 復原」。</div>',
    [['取消','close'],['填入這一天','ok','primary']],async act=>{if(act!=='ok')return true;
      draft.crews=crews;while(draft.crews.length<8)draft.crews.push(blankCrew());
      if(d.restD)draft.restD=pad4((d.restD||[]).map(n=>matchName(n,P)).filter(Boolean));if(d.restW)draft.restW=pad4((d.restW||[]).map(n=>matchName(n,P)).filter(Boolean));
      mOpen=new Set([0]);renderSchedEditor();toast('已填入 '+crews.length+' 組，會自動存到雲端');return true},true)}
function crewThai(c){const known={};(DB.sched||[]).forEach(x=>{crewSites(x).forEach((l,k)=>{const t=String(x.siteThai||'').split('\n')[k];if(t)known[l]=t})});
  sites.forEach(s=>{if(s.thai)known[s.name]=s.thai});return crewSites(c).map(l=>known[l]||'').join('\n')}
function addSiteLine(i,v){mOpen.add(i);v=v.trim();if(!v)return;const c=draft.crews[i];const lines=crewSites(c);if(lines.includes(v))return;lines.push(v);c.site=lines.join('\n');

  return sites.filter(s=>!/範例/.test(s.name)&&s.status!=='done').slice().sort((a,b)=>k(a)-k(b)||(b.lat||0)-(a.lat||0))
   .concat(sites.filter(s=>s.status==='done'))}

    // 工人格只列「工人」，不放司機／帶頭和全員上班這類特殊選項
    opts=DB.people.filter(p=>p.kind==='工人'&&!SPECIAL.test(p.name)).map(p=>p.name).filter(o=>o===cur||!u.has(o));if(cur&&!opts.includes(cur))opts.unshift(cur)}
  else if(k==='t'){title='施作項目（點完自動跳下一格）';opts=DB.tasks.map(t=>t.zh);free=true}
  else if(k==='s'){title='第 '+(i+1)+' 組・案場（可複選，由北到南）';free=true;const mine=crewSites(draft.crews[i]);const other={};
    draft.crews.forEach((c,j)=>{if(j!==i)crewSites(c).forEach(l=>(other[l]=other[l]||[]).push(j+1))});

  if(!groups)groups=[['',opts.map(v=>({v}))]];
  const pop=document.createElement('div');pop.id='gpop';
  pop.innerHTML='<div class="gph"><b>'+esc(title||'')+'</b><button data-pk="x" aria-label="關閉">✕</button></div>'+

    '<div class="gpl">'+groups.filter(g=>g[1].length).map(g=>(g[0]?'<div class="gpg">'+g[0]+'</div>':'')+'<div class="gpb">'+g[1].map(o=>'<button data-pv="'+esc(o.v)+'" class="'+(o.v===cur||o.on?'on':'')+'">'+(o.on?'✓ ':'')+(o.b?'<span class="dot" style="background:var(--'+BK[o.b].c.slice(2)+')"></span>':'')+esc(o.v)+(o.tag?'<em>'+o.tag+'</em>':'')+'</button>').join('')+'</div>').join('')+
    (groups.every(g=>!g[1].length)?'<div class="foot">都排完了</div>':'')+'</div>'+

let edSel=new Set(),edAnchor=null,edDown=false,edDragged=false;
// 每一格在表格上的位置：r0~r1 是列（每組上下兩列），c 是欄
function cellPos(k){const p=k.split('|'),t=p[0],i=+p[1],j=+p[2];
  if(t==='rd')return {r0:-2,r1:-2,c:3+i};if(t==='rw')return {r0:-1,r1:-1,c:3+i};
  if(t==='s')return {r0:2*i,r1:2*i+1,c:0};if(t==='l')return {r0:2*i,r1:2*i+1,c:1};if(t==='c')return {r0:2*i,r1:2*i+1,c:2};
  if(t==='w')return j<4?{r0:2*i,r1:2*i,c:3+j}:{r0:2*i+1,r1:2*i+1,c:3+j-4};
  if(t==='t')return {r0:2*i,r1:2*i+1,c:7+j};if(t==='n')return {r0:2*i,r1:2*i+1,c:12};return null}
function allKeys(){const k=[];draft.restD.forEach((_,j)=>k.push('rd|'+j));draft.restW.forEach((_,j)=>k.push('rw|'+j));
  draft.crews.forEach((c,i)=>{k.push('s|'+i,'l|'+i,'c|'+i);for(let j=0;j<8;j++)k.push('w|'+i+'|'+j);for(let j=0;j<5;j++)k.push('t|'+i+'|'+j);k.push('n|'+i)});return k}
function rectKeys(a,b){const A=cellPos(a),B=cellPos(b);if(!A||!B)return new Set([b]);const r0=Math.min(A.r0,B.r0),r1=Math.max(A.r1,B.r1),c0=Math.min(A.c,B.c),c1=Math.max(A.c,B.c);

// 三方合併：base＝上次跟雲端一致的樣子，mine＝我現在的，theirs＝雲端最新的。我有改的格子用我的，沒改的用雲端的

  wk.loading=true;renderSheet();
  try{const j=await getData('week',{place:wk.place,from:wk.from});
    if(wk.dirty){wk.loading=false;renderSheet();return}fillWeek(j.data);try{localStorage.setItem(ck,JSON.stringify(j.data))}catch(e){}}
  catch(e){if(!wk.data)wk.data={entries:{},counts:{},other:{},err:e.message};toast('讀不到這週資料：'+e.message)}
  wk.loading=false;wk.dirty=false;renderSheet()}

function sheetNums(i){const D=wk.data||{};const days=weekDays(wk.from);const g=wk.grid[i.id]||{days:{}};
  const saved=days.reduce((a,d)=>a+(Number((D.entries||{})[i.id]?.[d])||0),0);const now=days.reduce((a,d)=>a+(Number(g.days[d])||0),0);const diff=now-saved;
  const cur=wk.place==='大倉'?i.big:i.oil;
  if(D.start){const st=D.start[i.id]||0;const out=(D.out[i.id]||0)+diff;const end=st+(D.net[i.id]||0)-diff;return {st,out,end}}
  return {st:null,out:now,end:cur-diff}}

function weekInput(e){const t=e.target;if(!t.dataset.it)return;const g=wk.grid[t.dataset.it]=wk.grid[t.dataset.it]||{days:{},count:''};
  const v=t.value.replace(/[^\d.\-]/g,'');if(t.dataset.d==='count')g.count=v;else g.days[t.dataset.d]=v;t.classList.remove('ai');
  const it=stockItems.find(x=>x.id===t.dataset.it);if(it){const n=sheetNums(it);const o=$('so-'+it.id),b=$('sb-'+it.id);if(o)o.textContent=n.out?'-'+fmtN(n.out):'0';if(b){b.textContent=fmtN(n.end);b.classList.toggle('neg',n.end<0)}}
  if(!wk.dirty){wk.dirty=true;const s=document.querySelector('[data-w="save"]');if(s){s.disabled=false;s.textContent='儲存修改'}}}
// 像試算表一樣用 Enter／方向鍵移動
function sheetKey(e){const t=e.target;if(!t.dataset||t.dataset.r===undefined)return;let r=+t.dataset.r,c=+t.dataset.c;
  if(e.key==='Enter'||e.key==='ArrowDown')r+=e.shiftKey&&e.key==='Enter'?-1:1;else if(e.key==='ArrowUp')r--;
  else if(e.key==='ArrowRight'&&t.selectionStart===t.value.length)c++;else if(e.key==='ArrowLeft'&&t.selectionStart===0)c--;else return;
  const x=document.querySelector('#stockPage input[data-r="'+r+'"][data-c="'+c+'"]');if(x){e.preventDefault();x.focus();x.select()}}

async function weekClick(e){const b=e.target.closest('[data-w]');if(!b)return;const w=b.dataset.w;
  const leave=()=>!wk.dirty||confirmStep('leave-week');const stay=()=>toast('還沒儲存，再按一次就放棄修改');
  if(w==='noteoff'){wk.note='';renderSheet();return}
  if(w==='alerts'){if(!leave())return stay();wk.dirty=false;stockMode='list';stFilter='out';renderStock();return}
  if(w==='newitem'){openItemModal(null);return}
  if(w==='print'){printWeek(wk.from,[wk.place],[wk.type]);return}
  if(w==='item'){openHistory(stockItems.find(x=>x.id===b.dataset.v));return}
  if(w==='prev'||w==='next'||w==='thisweek'){if(!leave())return stay();wk.from=w==='thisweek'?mondayOf(DB.today):addDays(wk.from,w==='prev'?-7:7);wk.data=null;return loadWeek()}
  if(w==='place'){if(wk.place===b.dataset.v)return;if(!leave())return stay();wk.place=b.dataset.v;wk.data=null;return loadWeek()}
  if(w==='type'){wk.type=b.dataset.v;renderSheet();return}
  if(w==='photo'){const inp=$('wkPhoto');inp.onchange=async()=>{const files=[...inp.files];if(!files.length)return;b.disabled=true;
      const days=weekDays(wk.from);const all=stockItems.slice().sort((x,y)=>x.order-y.order);
      const items=all.map(i=>({no:i.order,type:i.type,name:(i.section?i.section.replace('大浴室','大衛浴')+'・':'')+i.name,spec:i.spec||''}));
      // 手寫「4+4」這種算式也收：加總
      const numVal=q=>{if(q===null||q===undefined||q==='')return null;if(typeof q==='number')return isFinite(q)?q:null;
        const t=String(q).replace(/\s/g,'');if(!/^\d+(\.\d+)?(\+\d+(\.\d+)?)*$/.test(t))return null;return t.split('+').reduce((x,y)=>x+Number(y),0)};
      const findItem=r=>{let it=all.find(i=>i.order===Number(r.no));if(it)return it;const nm=norm(r.name||'');if(!nm)return null;
        return all.find(i=>norm(itemLabel(i))===nm)||all.find(i=>nm.includes(norm(i.name))&&(!i.spec||nm.includes(norm(i.spec))))||null};
      let total=0;const perType={};const errs=[];
      for(let k=0;k<files.length;k++){b.textContent='AI 辨識中…'+(files.length>1?'（第 '+(k+1)+'/'+files.length+' 張）':'（約 30 秒）');
        try{const img=await shrink2(files[k],2400);const d=(await api('week_ocr',{image:img,dates:days,items})).data;
          (d.rows||[]).forEach(r=>{const it=findItem(r);if(!it)return;const g=wk.grid[it.id]=wk.grid[it.id]||{days:{},count:''};const A=wk.ai[it.id]=wk.ai[it.id]||{};
            (r.days||[]).forEach((q,j)=>{const v=numVal(q);if(v!==null&&j<7){g.days[days[j]]=String(v);A[days[j]]=1;total++;perType[it.type]=(perType[it.type]||0)+1}});
            const c=numVal(r.count);if(c!==null){g.count=String(c);A.count=1;total++;perType[it.type]=(perType[it.type]||0)+1}})}
        catch(err){errs.push(err.message)}}
      const types=Object.keys(perType).sort((x,y)=>perType[y]-perType[x]);
      if(total){wk.dirty=true;if(!perType[wk.type])wk.type=types[0];
        wk.note='AI 從照片讀到 '+total+' 格（'+types.map(t=>wk.place+t+' '+perType[t]+' 格').join('、')+'），已用黃色標出。請一格一格核對，沒問題再按「儲存修改」。';}
      else wk.note=errs.length?'':'AI 沒有讀到手寫數字。請確認：照片是這一週（'+mdw(days[0])+'～'+mdw(days[6])+'）的表、整張拍進去、字清楚。';
      renderSheet();toast(errs.length?errs[0]:(total?'AI 讀到 '+total+' 格，請核對黃色格子':'AI 沒讀到數字'));
      const nb=document.querySelector('[data-w="photo"]');if(nb){nb.disabled=false}inp.value=''};inp.click();return}
  if(w==='save'){b.disabled=true;b.textContent='儲存中…';
    try{const rows=Object.keys(wk.grid).map(id=>({itemId:id,days:wk.grid[id].days,count:wk.grid[id].count}));
      const d=(await api('week_save',{place:wk.place,from:wk.from,rows})).data;wk.dirty=false;toast('已儲存（'+d.outs+' 筆出貨）');await load()}
    catch(err){toast(err.message);b.disabled=false;b.textContent='儲存修改'}}}
function shrink2(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
  const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res({type:'image/jpeg',data:cv.toDataURL('image/jpeg',.85).split(',')[1]})};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

$('managePage').addEventListener('click',async e=>{const ac=e.target.closest('[data-acc],[data-adel]');if(ac&&accDraft){
    if(ac.dataset.adel!==undefined){accDraft.splice(+ac.dataset.adel,1);renderAcc();return}
    if(ac.dataset.acc==='add'){accDraft.push({name:'',pin:'',role:'管理',on:true});renderAcc();return}
    if(ac.dataset.acc==='save'){ac.disabled=true;ac.textContent='儲存中…';try{await api('users_save',{users:accDraft});toast('帳號已儲存');accDraft=null;loadAcc()}catch(err){toast(err.message);ac.disabled=false;ac.textContent='儲存'}return}}const a=e.target.closest('[data-madd]');if(a){const k=a.dataset.madd;mdirty=true;mdraft[k].push(k==='people'?{name:'',kind:'工人'}:k==='cars'?{name:''}:{zh:'',th:''});renderManage();return}
  const d=e.target.closest('[data-mdel]');if(d){mdirty=true;mdraft[d.dataset.mdel].splice(+d.dataset.i,1);renderManage();return}
  const s=e.target.closest('[data-ms]');if(s){const k=s.dataset.ms;s.disabled=true;s.textContent='儲存中…';
    try{await api('list_save',{kind:k,rows:mdraft[k].filter(x=>(x.name||x.zh||'').trim())});toast('已儲存');mdraft=null;mdirty=false;await load();renderManage()}catch(err){toast(err.message);s.disabled=false;s.textContent='儲存'}}});

// ================= 啟動 =================

// ================= 手機：表格自己縮放（兩指捏、＋－鈕），整頁不亂縮 =================
const touchDev=()=>window.matchMedia('(pointer:coarse)').matches&&window.innerWidth<1100;
let TZ={};try{TZ=JSON.parse(localStorage.getItem('fulin-tz')||'{}')}catch(e){}
function tzKey(t){return t.classList.contains('sheet')?'sheet':t.classList.contains('wkview')?'week':'board'}
function tzSave(){try{localStorage.setItem('fulin-tz',JSON.stringify(TZ))}catch(e){}}
function tzFit(t){const w=t.parentElement;const old=t.style.zoom;t.style.zoom=1;const f=Math.min(1,(w.clientWidth-2)/t.scrollWidth);t.style.zoom=old;return f}
function tzSet(t,z,keep){const k=tzKey(t);const f=tzFit(t);z=Math.max(f*0.9,Math.min(2.5,z));t.style.zoom=z;if(keep!==false){TZ[k]=Math.abs(z-f)<0.01?0:z;tzSave()}
  const bar=t.parentElement.previousElementSibling;if(bar&&bar.classList.contains('zbar'))bar.querySelector('b').textContent=Math.round(z*100)+'%'}
function applyZoom(force){const on=touchDev();document.querySelectorAll('.boardwrap>table:not(.edit)').forEach(t=>{const w=t.parentElement;if(on&&!t.offsetParent)return;
  let bar=w.previousElementSibling;if(!on){t.style.zoom='';if(bar&&bar.classList.contains('zbar'))bar.remove();return}
  if(!bar||!bar.classList.contains('zbar')){bar=document.createElement('div');bar.className='zbar';bar.innerHTML='<span>兩指捏可以放大縮小</span><button data-z="-">－</button><b></b><button data-z="+">＋</button><button data-z="fit">符合螢幕</button>';w.parentElement.insertBefore(bar,w)}
  if(t.dataset.tzi&&!force)return;t.dataset.tzi='1';const z=TZ[tzKey(t)]||tzFit(t);tzSet(t,z,false)})}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.zbar [data-z]');if(!b)return;const w=b.parentElement.nextElementSibling;const t=w&&w.querySelector(':scope>table');if(!t)return;
  const z=parseFloat(t.style.zoom)||1;const v=b.dataset.z;if(v==='fit'){TZ[tzKey(t)]=0;tzSave();tzSet(t,tzFit(t),false)}else tzSet(t,z*(v==='+'?1.25:0.8))});
let pin=null;
document.addEventListener('touchstart',e=>{if(e.touches.length!==2)return;const w=e.target.closest&&e.target.closest('.boardwrap');const t=w&&w.querySelector(':scope>table:not(.edit)');if(!t||!touchDev())return;
  const a=e.touches[0],b=e.touches[1];const r=w.getBoundingClientRect();pin={t,w,d0:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z0:parseFloat(t.style.zoom)||1,cx:(a.clientX+b.clientX)/2-r.left,cy:(a.clientY+b.clientY)/2-r.top,sl:w.scrollLeft,st:document.scrollingElement.scrollTop}},{passive:true});
document.addEventListener('touchmove',e=>{if(!pin||e.touches.length!==2)return;e.preventDefault();const a=e.touches[0],b=e.touches[1];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  const z0=pin.z0;tzSet(pin.t,z0*d/pin.d0,false);const z=parseFloat(pin.t.style.zoom)||1;pin.w.scrollLeft=(pin.sl+pin.cx)*z/z0-pin.cx},{passive:false});
document.addEventListener('touchend',e=>{if(pin&&e.touches.length<2){tzSet(pin.t,parseFloat(pin.t.style.zoom)||1);pin=null}});
let tzRaf=0;const tzQueue=()=>{if(tzRaf)return;tzRaf=requestAnimationFrame(()=>{tzRaf=0;applyZoom(false)})};
new MutationObserver(tzQueue).observe($('todayPage'),{childList:true,subtree:true});
new MutationObserver(tzQueue).observe($('stockPage'),{childList:true,subtree:true});
window.addEventListener('resize',()=>setTimeout(()=>applyZoom(true),200));
// ---- 配色：深藍科技／藍天白雲（字大）／萬聖節，每台裝置自己記 ----
const THEMES=[['navy','🌙','深藍科技','原本的深色'],['sky','☀️','藍天白雲','淺色、字比較大，長輩好讀'],['mt','🏔️','雪山金光','藍天、金色山光、暖色草原（字大）'],['hw','🎃','萬聖節','南瓜橘＋蝙蝠']];
function curTheme(){const c=document.documentElement.classList;return c.contains('sky')?'sky':c.contains('mt')?'mt':c.contains('hw')?'hw':'navy'}
function setTheme(t){const c=document.documentElement.classList;c.remove('sky','hw','mt');if(t!=='navy')c.add(t);try{localStorage.setItem('fulin-theme',t);localStorage.setItem('fulin-theme-keep','1')}catch(e){}
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='sky'?'#1E88E5':t==='mt'?'#2E4A72':t==='hw'?'#140C1C':'#15202B';if(typeof applyZoom==='function')setTimeout(()=>applyZoom(true),50)}
$('themeBtn').onclick=e=>{e.stopPropagation();let m=$('thmenu');if(m){m.remove();return}m=document.createElement('div');m.id='thmenu';m.className='thmenu';const cur=curTheme();
  m.innerHTML=THEMES.map(([k,i,n,d])=>'<button data-th="'+k+'" aria-pressed="'+(k===cur)+'"><i>'+i+'</i><span>'+n+'<small>'+d+'</small></span></button>').join('');document.body.appendChild(m);
  m.onclick=ev=>{const b=ev.target.closest('[data-th]');if(!b)return;setTheme(b.dataset.th);m.remove();toast('已換成「'+THEMES.find(x=>x[0]===b.dataset.th)[2]+'」')}};
document.addEventListener('click',e=>{const m=$('thmenu');if(m&&!e.target.closest('#thmenu,#themeBtn'))m.remove()});
setAdminUI();
showTab((location.hash||'#map').slice(1));
initMap();render();
// 先用上次的資料立刻顯示，同時在背景抓最新的
if(canField()){showGate(false);(function(){try{const c=JSON.parse(localStorage.getItem('fulin-db')||'null');if(c&&c.sites){DB=c;applyData();$('updated').textContent='更新中…'}}catch(e){}})();load()}else showGate(true);
setInterval(()=>{if(!schedEdit&&!document.getElementById('modalBg'))load()},(CFG.REFRESH_MINUTES||5)*60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!schedEdit&&!document.getElementById('modalBg'))load()});
})();
